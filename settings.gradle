plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'WikiKernel'

dependencyResolutionManagement {
    repositories {
        mavenCentral()
    }
}

include 'common'
include 'core'
include 'mixin-agent'
include 'server'
include 'server:oss-server'

file('plugin')
        .listFiles()
        ?.findAll { it.directory && new File(it, 'build.gradle').exists() }
        ?.sort { it.name }
        ?.each { include "plugin:${it.name}" }
