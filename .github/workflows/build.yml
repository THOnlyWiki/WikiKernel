name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Tags build a dated release; normal branches keep the snapshot version.
  WIKIKERNEL_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Private plugin submodules are intentionally not fetched. The public
          # build only needs the plugins that are present in this repository.

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build, test, and create distribution
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build dist checkPluginDependencies \
            --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show build failure
        if: failure()
        shell: bash
        run: |
          echo "::error::Gradle build failed. Failure summary:"
          grep -E 'FAILED|What went wrong|Execution failed|There were failing tests|tests completed|Caused by:|^[A-Za-z0-9_.$]+ > .* FAILED' build.log \
            | tail -n 20 \
            | sed 's/^/::error::/'
          echo "::error::Test failures:"
          find . -path '*/build/test-results/test/*.xml' -type f -print0 \
            | xargs -0 grep -h '<failure' 2>/dev/null \
            | head -n 12 \
            | sed 's/^/::error::/'

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: wikikernel-dist
          path: build/dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: wikikernel-dist
          path: release

      - name: Package release zip
        shell: bash
        run: |
          cd release
          zip -r "wikikernel-${GITHUB_REF_NAME}.zip" .

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: WikiKernel ${{ github.ref_name }}
          files: release/wikikernel-*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
