# 中文注释/字符串统一按 UTF-8 处理，避免 Windows 默认编码导致乱码
org.gradle.jvmargs=-Dfile.encoding=UTF-8

# 多模块并行构建 + 构建缓存
org.gradle.parallel=true
org.gradle.caching=true

# 插件 compileOnly 引用的 Spring Boot 版本（与根 build.gradle plugins 块保持一致）
springBootVersion=4.1.1

# Lombok：所有 Java 模块统一使用（版本与 Spring Boot BOM 保持一致）
lombokVersion=1.18.46

# MyBatis-Plus（含 Boot 4 官方 starter）
mybatisPlusVersion=3.5.17

# GraalJS（TypeScript 服务端编译：在 JVM 里跑官方 typescript.js，自包含、不依赖主机 Node）
graalJsVersion=24.2.1
