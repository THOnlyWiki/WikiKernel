version.parserTags.intro=下面列出本站可用的解析器標籤（點擊標籤名查看用法與參數）。
version.parserTags.source.core=WikiKernel 核心
version.parserTags.source.other=其它插件
version.parserTags.table.tag=標籤
version.parserTags.table.usage=説明
version.parserTags.sourceLabel=來源
version.parserTags.aliases=別名
version.parserTags.usage=用法
version.parserTags.params=參數
version.tag.ref.usage=<ref>出處</ref>：給正文加腳註；配合 <references /> 顯示腳註列表。
version.tag.ref.description=屬性：name（命名腳註；先寫 <ref name="x">內容</ref>，再用 <ref name="x" /> 複用）；標籤之間的 wikitext 就是腳註內容。
version.tag.references.usage=<references />：在頁面中顯示腳註列表（通常是「腳註」小節）。
version.tag.references.description=別名：<reference />（行為一致）；沒有屬性。
version.tag.nowiki.usage=<nowiki>文本</nowiki>：原樣輸出，不解析 wikitext。
version.tag.pre.usage=<pre>文本</pre>：等寬預排版，保留空格與換行。
version.tag.poem.usage=<poem>詩句</poem>：按行斷行、保留縮進，行內仍解析 wikitext。
version.tag.gallery.usage=<gallery>文件:甲.jpg|説明（每行一張）</gallery>：圖片畫廊。
version.tag.gallery.description=屬性：widths（圖片最大寬度，默認 120）、heights（最大高度）、perrow（每行幾張）、mode（traditional / nolines / packed）、caption、class；文件名可寫「文件:甲.jpg」或直接「甲.jpg」，不存在的文件顯示紅鏈。
version.tag.syntaxhighlight.usage=<syntaxhighlight lang="java">代碼</syntaxhighlight>：帶語法高亮的代碼塊。
version.tag.syntaxhighlight.description=參數：lang（java / kotlin / javascript / typescript / css / json / xml / html / python / bash / sql / properties / lua / markdown / wikitext，可用簡寫 js / ts / kt / py / sh / htm / md 等）；<source lang="…"> 是舊名，行為一致。
version.tag.markdown.usage=<markdown># 標題</markdown>：把內容按 Markdown 渲染。
version.tag.markdown.description=支持標題、列表、引用、圍欄代碼塊（```lang）、GFM 表格、刪除線、鏈接與圖片；行內 HTML 按白名單過濾。
version.tag.math.usage=<math>公式</math>：TeX 數學公式（KaTeX 渲染）。
version.tag.math.description=參數：display="inline|block"（默認 inline）；<chem>分子式</chem> 寫化學式（\\ce{…} 語法）。
version.tag.timeline.usage=<timeline>Period = from:… till:…</timeline>：EasyTimeline 時間線（常用子集），渲染成內聯 SVG。
version.tag.timeline.description=支持 ImageSize / PlotArea / AlignBars / DateFormat / Period / TimeAxis / ScaleMajor / ScaleMinor / Colors / BackgroundColors / Legend / PlotData / TextData 等命令；未實現的 LineData 按原版註釋忽略。
version.tag.graph.usage=<graph>{…Vega 規範…}</graph>：Vega / Vega-Lite 圖表。
version.tag.graph.description=參數：title（圖注）、width / height；標籤內容是 Vega 規範 JSON，用本站內置的 Vega 渲染（無外部服務）。
version.tag.comment.usage=<comment />：在該頁面底部顯示評論區（發表 / 回覆）。
version.tag.comment.description=別名：<comments />；沒有屬性。
version.tag.categorytree.usage=<categorytree>分類名</categorytree>：顯示該分類的成員樹。
version.tag.categorytree.description=屬性：mode（categories / pages / all / parents）、depth（默認 1）、hideroot、hideprefix、showcount、namespaces、class、style。
version.tag.seo.usage=<seo>title=標題|description=描述</seo>：給頁面寫 SEO 元數據（也支持標籤屬性寫法，如 <seo title="…">）。
version.tag.seo.description=鍵（與 WikiSEO 一致）：title / title_mode / title_separator / keywords / description / canonical / robots / googlebot / image / image_width / image_height / image_alt / type / site_name / locale / section / author / published_time / twitter_site / twitter_card；description=auto 交給系統自動生成。
version.tag.inputbox.usage=<inputbox>type=create</inputbox>：創建 / 搜索框（標籤內容每行一個 key=value）。
version.tag.inputbox.description=鍵：type（create 默認 / search / fulltext）、default、placeholder、id、buttonlabel、width、prefix、preload、editintro（建頁時預載 / 提示）。
version.tag.flash-player.usage=<flash-player file="演示.swf" width="320" height="240">説明文字</flash-player>：內嵌 Flash 播放器（Ruffle）。
version.tag.flash-player.description=屬性：file（外部 URL / [[文件:X.swf]] / 文件名）；width（默認 550）、height（400）、autoplay（默認 true）、loop（默認 false）、fullscreen、letterbox、menu、bgcolor、quality、scale、wmode、allowscriptaccess、unmute、flashvars、base、caption；標籤內容也是説明文字。
version.tag.templatedata.usage=<templatedata>{…JSON…}</templatedata>：給模板聲明參數（可視化編輯與文檔用）。
version.tag.templatedata.description=標籤內容是原始 JSON（description / params / paramOrder 等，與 MediaWiki TemplateData 相同）；校驗通過後寫入頁面屬性並渲染參數表。
version.tag.exclude-banner-page.usage=<exclude-banner-page />：讓本頁不顯示頁面橫幅。
version.tag.indicator.usage=<indicator name="例子">[[文件:图标.png|20px]]</indicator>：頁面狀態指示器（標題右上角的小圖標）。
version.tag.indicator.description=屬性：name（必填，同名只顯示一個）；內容按行內 wikitext 解析，通常放小圖標（例如 [[文件:星星.png|20px|link=]]）。
