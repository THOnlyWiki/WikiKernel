<!DOCTYPE html>
<!-- 公共片段：页脚语言切换（Vector / fallback / 插件皮肤共用） -->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<li class="footer-languages" th:fragment="languages">
    <span th:text="#{site.language}">语言：</span>
    <th:block th:each="lang,loop : ${interfaceLanguages}">
        <span th:unless="${loop.first}" class="language-separator" aria-hidden="true">·</span>
        <a th:href="${currentPath + interfaceLanguageQuery + 'uselang=' + lang.code}"
           th:lang="${lang.locale.toLanguageTag()}" th:hreflang="${lang.locale.toLanguageTag()}"
           th:classappend="${interfaceLanguage == lang} ? 'selected'"
           th:attr="aria-current=${interfaceLanguage == lang ? 'true' : null}"
           th:text="${lang.label}"></a>
    </th:block>
</li>
</body>
</html>
