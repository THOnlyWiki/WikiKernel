<!DOCTYPE html>
<!-- 页面已被删除：访问被删页面时的提示（仿 MediaWiki：说明 + 管理员可找回源代码 / 恢复）。
     与 wiki/view.html 同一套外壳（皮肤布局 + 页签由布局负责，历史页也复用本模板） -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${page.title}, ~{:: section})}">
<body>
<section class="wiki-deleted-page">
    <div class="wiki-warning deleted-notice">
        <p class="deleted-notice-title" th:text="#{deleted.notice.title}">此页面已被删除。</p>
        <p th:text="#{deleted.notice.body}">
            删除和移动日志位于下方。您可以在其他页面中搜索本页标题，或查看相关的日志记录。
        </p>
        <p th:unless="${canRestore}" th:text="#{deleted.notice.adminOnly}">
            只有管理员可以查看或恢复被删除页面的内容。
        </p>
        <p th:if="${canRestore}">
            <a th:href="${restoreUrl}" th:text="#{deleted.notice.viewSource}">查看或恢复已删除的编辑</a>
        </p>
    </div>

    <!-- /* 找回源代码（仅管理员）：最近版本的 wikitext 原文 */ -->
    <th:block th:if="${canRestore}">
        <h2 class="deleted-source-title" th:text="#{deleted.source.title}">找回源代码（最近版本）</h2>
        <p class="wiki-hint" th:text="#{deleted.source.hint}">
            下面是本页面被删除时最近一次编辑的原始 wikitext，可复制到新页面继续编辑；也可以点上方链接恢复整个页面。
        </p>
        <pre class="wiki-deleted-source" th:text="${deletedContent}">（空）</pre>
        <p class="deleted-source-actions">
            <a class="wiki-button" th:href="${restoreUrl}" th:text="#{deleted.source.restore}">恢复本页面</a>
        </p>
    </th:block>
</section>
</body>
</html>
