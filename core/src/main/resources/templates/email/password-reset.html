<!DOCTYPE html>
<!-- 密码重置链接页（邮件里的 /password/reset?token=…）：设置新密码 / 成功 / 无效 -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <div class="wiki-auth">
        <p class="form-message success" th:if="${state == 'success'}" th:text="#{passwordReset.success}">
            密码已重置，现在可以用新密码登录了。
        </p>
        <p class="form-message" th:if="${state == 'invalid'}" th:text="#{passwordReset.invalid}">
            重置链接无效、已过期或邮箱已变更，请重新申请。
        </p>

        <form id="wiki-password-reset-form" class="wiki-form" th:action="@{/password/reset}" method="post"
              th:if="${state == 'form'}">
            <input type="hidden" name="token" th:value="${token}"/>
            <p th:text="#{passwordReset.introForm}">请设置新密码。</p>
            <div class="form-field">
                <label for="wpNewPassword" th:text="#{passwordReset.newPassword}">新密码：</label>
                <input type="password" id="wpNewPassword" name="password" autocomplete="new-password" required/>
                <div class="wiki-hint" th:text="#{auth.passwordHint}">建议使用 8 个以上字符，并混合字母、数字与符号。</div>
            </div>
            <div class="form-field">
                <label for="wpNewPassword2" th:text="#{passwordReset.confirmPassword}">确认新密码：</label>
                <input type="password" id="wpNewPassword2" name="confirmPassword" autocomplete="new-password" required/>
            </div>

            <p class="form-message" th:if="${error != null}" th:text="${error}">两次输入的密码不一致。</p>

            <div class="form-actions">
                <button type="submit" class="wiki-button" th:text="#{passwordReset.save}">保存新密码</button>
            </div>
        </form>

        <p th:if="${state == 'success'}">
            <a class="wiki-button" th:href="@{/wiki/特殊:登录}" th:text="#{passwordReset.login}">前往登录</a>
        </p>
        <p th:if="${state == 'invalid'}">
            <a th:href="@{/wiki/特殊:重置密码}" th:text="#{passwordReset.requestAgain}">重新申请重置</a>
        </p>
    </div>
</section>
</body>
</html>
