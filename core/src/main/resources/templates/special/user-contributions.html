<!DOCTYPE html>
<!-- 特殊:用户贡献 / Special:Contributions：每条贡献可查看旧版本 / 历史 / 编辑 -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <div th:if="${userNotFound}" th:text="#{permissions.userNotFound}">用户不存在。</div>

    <th:block th:if="${user != null}">
        <p><span th:text="#{contributions.introPrefix}">用户</span><a
                th:href="@{/wiki/{t}(t=${'用户:' + user.username})}" th:text="${user.username}">用户</a><span
                th:text="#{contributions.introSuffix}">的编辑贡献：</span></p>
        <p th:if="${#lists.isEmpty(rows)}" th:text="#{contributions.none}">该用户还没有编辑。</p>
        <ul class="change-list" th:unless="${#lists.isEmpty(rows)}">
            <li th:each="row : ${rows}">
                <span class="history-date"
                      th:text="${@wikiTime.format(row.revision.createAt)}">时间</span>
                <a th:if="${row.page != null}" th:href="${row.pageUrl}" th:text="${row.page.title}">页面</a>
                <span class="history-actions" th:if="${row.page != null}">
                    <span th:if="${row.current}" class="history-current" th:text="#{common.current}">当前</span>
                    <a th:href="${row.diffUrl}" th:text="#{recentChanges.diff}">差异</a>
                    <a th:if="${!row.current}" th:href="${row.oldUrl}" th:text="#{history.view}">查看</a>
                    <a th:href="${row.historyUrl}" th:text="#{recentChanges.hist}">历史</a>
                    <a th:href="${row.editUrl}" th:title="#{contributions.editOld}"
                       th:text="#{common.edit}">编辑</a>
                </span>
                <span class="history-comment"
                      th:text="${row.revision.comment == null or row.revision.comment.isEmpty()
                              ? #messages.msg('common.noSummary') : row.revision.comment}">摘要</span>
            </li>
        </ul>
    </th:block>
</section>
</body>
</html>
