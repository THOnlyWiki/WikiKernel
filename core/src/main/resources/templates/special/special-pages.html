<!DOCTYPE html>
<!-- 特殊页模板：特殊:特殊页面 / Special:SpecialPages（MediaWiki 标准分组列表） -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <th:block th:each="group : ${groups}">
        <h2 class="mw-specialpagesgroup" th:id="|mw-specialpagesgroup-${group.id}|">
            <span class="mw-headline" th:text="${group.label}">分组</span>
        </h2>
        <div class="mw-specialpages-list">
            <ul>
                <li class="mdui-ripple" th:each="item : ${group.items}">
                    <a th:href="@{/wiki/{title}(title=${item.urlName})}"
                       th:title="${item.name}" th:text="${item.name}">名称</a>
                </li>
            </ul>
        </div>
    </th:block>
</section>
</body>
</html>
