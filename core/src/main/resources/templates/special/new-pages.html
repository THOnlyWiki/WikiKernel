<!DOCTYPE html>
<!-- 特殊:最新页面 / Special:NewPages：最近创建的页面（差异 | 历史、创建者、大小、摘要） -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <p th:text="#{newPages.intro}">最近创建的页面（仿 MediaWiki 的 特殊:最新页面）。</p>

    <form class="wiki-form allpages-form" method="get" th:action="@{/wiki/特殊:最新页面}">
        <div class="allpages-fields">
            <div class="allpages-row">
                <label for="newpages-namespace" th:text="#{newPages.namespace}">命名空间：</label>
                <select id="newpages-namespace" name="namespace">
                    <option th:each="opt : ${namespaceOptions}" th:value="${opt.id}" th:text="${opt.label}"
                            th:selected="${opt.selected}">全部命名空间</option>
                </select>
            </div>
            <div class="allpages-row">
                <label for="newpages-limit" th:text="#{newPages.limit}">显示条数：</label>
                <select id="newpages-limit" name="limit">
                    <option th:each="value : ${limitOptions}" th:value="${value}"
                            th:selected="${selectedLimit == value}" th:text="${value}">50</option>
                </select>
                <button type="submit" class="wiki-button" th:text="#{allPages.submit}">提交</button>
            </div>
        </div>
    </form>

    <p th:if="${#lists.isEmpty(rows)}" th:text="#{newPages.none}">还没有任何页面。</p>
    <table class="wikitable newpages-table" th:unless="${#lists.isEmpty(rows)}">
        <tr>
            <th th:text="#{newPages.time}">时间</th>
            <th th:text="#{newPages.page}">页面</th>
            <th th:text="#{newPages.user}">用户</th>
            <th th:text="#{newPages.bytes}">大小</th>
            <th th:text="#{newPages.comment}">摘要</th>
        </tr>
        <tr th:each="row : ${rows}">
            <td class="newpages-time" th:text="${@wikiTime.format(row.time)}">时间</td>
            <td>
                <a th:href="${row.url}" th:text="${row.title}">页面</a>
                <span class="newpages-links">（<a th:href="${row.diffUrl}" th:text="#{newPages.diff}">差异</a>
                    <span class="language-separator">|</span>
                    <a th:href="${row.historyUrl}" th:text="#{newPages.history}">历史</a>）</span>
            </td>
            <td>
                <a th:if="${row.userName != null and row.userUrl != null}" th:href="${row.userUrl}" th:text="${row.userName}">用户</a>
                <span th:if="${row.userName != null and row.userUrl == null}" th:text="${row.userName}"
                      th:title="#{common.importedAuthorHint}">原始作者</span>
                <span th:if="${row.userName == null}" th:text="#{common.anonymous}">匿名用户</span>
            </td>
            <td class="newpages-bytes" th:text="${row.bytes}">0</td>
            <td class="newpages-comment"
                th:text="${#strings.isEmpty(row.comment) ? #messages.msg('common.noSummary') : row.comment}">摘要</td>
        </tr>
    </table>
</section>
</body>
</html>
