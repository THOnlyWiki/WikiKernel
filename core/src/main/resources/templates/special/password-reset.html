<!DOCTYPE html>
<!-- 特殊:重置密码 / Special:PasswordReset：忘记密码入口（表单提交到 /password/reset-request） -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <div class="wiki-auth">
        <p class="form-message success" th:if="${sent == true}" th:text="#{passwordReset.sent}">
            如果该账号存在并绑定了电子邮箱，重置邮件已经发送。
        </p>
        <p class="form-message" th:if="${rateLimited == true}"
           th:text="#{rateLimit.passwordReset(${retryAfter})}">请求过于频繁，请稍后再试。</p>

        <p th:text="#{passwordReset.intro}">
            输入您的用户名或电子邮箱地址。如果该账号存在并绑定了电子邮箱，我们会发送一封包含重置链接的邮件。
        </p>

        <form id="wiki-password-reset-request" class="wiki-form"
              th:action="@{/password/reset-request}" method="post">
            <div class="form-field">
                <label for="wpResetUser" th:text="#{passwordReset.usernameLabel}">用户名或电子邮箱：</label>
                <input type="text" id="wpResetUser" name="username" autofocus required/>
            </div>
            <div class="form-actions">
                <button type="submit" class="wiki-button" th:text="#{passwordReset.submit}">重置密码</button>
            </div>
        </form>

        <p class="auth-subtitle">
            <a th:href="@{/wiki/特殊:登录}" th:text="#{auth.login}">登录</a>
            <span class="language-separator">·</span>
            <a th:href="@{/wiki/特殊:注册}" th:text="#{auth.createAccount}">创建账号</a>
        </p>
    </div>
</section>
</body>
</html>
