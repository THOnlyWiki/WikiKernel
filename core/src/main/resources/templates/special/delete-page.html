<!DOCTYPE html>
<!-- 特殊:删除页面 / Special:DeletePage -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <p class="delete-intro" th:text="#{delete.intro}">删除后页面及其历史会从公开界面移除。</p>

    <form th:if="${sourcePage == null and pageNotFound != true}" id="wiki-delete-lookup" class="wiki-form wiki-form-inline"
          th:action="@{/wiki/特殊:删除页面}" method="get">
        <input type="text" name="page" th:value="${lookupName}" th:placeholder="#{move.fromPlaceholder}"
               autofocus required/>
        <button type="submit" class="wiki-button" th:text="#{userRights.load}">加载</button>
    </form>
    <p class="wiki-form-error" th:if="${pageNotFound}" th:text="#{permissions.userNotFound}">页面不存在。</p>

    <th:block th:if="${sourcePage != null}">
        <p class="move-from">
            <span th:text="#{move.from}">原页面：</span>
            <a th:href="@{/wiki/{t}(t=${sourcePage.title})}" th:text="${sourcePage.title}">标题</a>
        </p>
        <p class="wiki-form-error" th:if="${deleteForbidden}" th:text="#{delete.forbidden}">
            您没有权限删除这个页面。
        </p>
        <p class="wiki-form-error" th:if="${protectedPage}" th:text="#{delete.protected}">
            本页面已被保护，只有管理员可以删除。
        </p>

        <!-- 无权限 / 未登录（不渲染表单）时也要能返回原页面 -->
        <p class="page-back" th:unless="${canDelete}">
            <a class="wiki-button" th:href="@{/wiki/{t}(t=${sourcePage.title})}"
               th:text="#{common.back}">返回</a>
        </p>

        <form th:if="${canDelete}" id="wiki-delete-form" class="wiki-form" method="post"
              th:action="@{/api/pages/delete}">
            <input type="hidden" name="title" th:value="${sourcePage.title}"/>
            <div class="form-field">
                <label for="wiki-delete-reason" th:text="#{delete.reason}">删除理由（可选）</label>
                <input type="text" id="wiki-delete-reason" name="reason" maxlength="500"/>
            </div>
            <div class="form-message" role="alert" hidden></div>
            <div class="form-actions">
                <button type="submit" class="wiki-button wiki-button-danger" th:text="#{delete.submit}">删除页面</button>
                <a class="wiki-button" th:href="@{/wiki/{t}(t=${sourcePage.title})}"
                   th:text="#{common.back}">返回</a>
            </div>
        </form>
    </th:block>
</section>
</body>
</html>
