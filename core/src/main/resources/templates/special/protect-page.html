<!DOCTYPE html>
<!-- 特殊:保护页面 / Special:ProtectPage -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <p class="protect-intro" th:text="#{protect.intro}">保护后只有管理员可以编辑本页面。</p>

    <form th:if="${sourceTitle == null and pageNotFound != true}" id="wiki-protect-lookup" class="wiki-form wiki-form-inline"
          th:action="@{/wiki/特殊:保护页面}" method="get">
        <input type="text" name="page" th:value="${lookupName}" th:placeholder="#{move.fromPlaceholder}"
               autofocus required/>
        <button type="submit" class="wiki-button" th:text="#{userRights.load}">加载</button>
    </form>
    <p class="wiki-form-error" th:if="${pageNotFound}" th:text="#{error.pageMissing(${lookupName})}">页面不存在。</p>

    <p class="wiki-form-error" th:if="${protectError}" th:text="${protectError}"></p>

    <th:block th:if="${sourceTitle != null}">
        <p class="wiki-hint" th:if="${protectUncreated}" th:text="#{protect.uncreated}"></p>
        <p class="move-from">
            <span th:text="#{move.from}">原页面：</span>
            <a th:href="@{/wiki/{t}(t=${sourceTitle})}" th:text="${sourceTitle}">标题</a>
        </p>
        <p class="wiki-form-error" th:if="${protectForbidden}" th:text="#{protect.forbidden}">
            只有管理员可以更改保护状态。
        </p>

        <!-- 无权限 / 未登录（不渲染表单）时也要能返回原页面 -->
        <p class="page-back" th:unless="${canProtect}">
            <a class="wiki-button" th:href="@{/wiki/{t}(t=${sourceTitle})}"
               th:text="#{common.back}">返回</a>
        </p>

        <form th:if="${canProtect}" id="wiki-protect-form" class="wiki-form" method="post"
              th:action="@{/api/pages/protect}">
            <input type="hidden" name="title" th:value="${sourceTitle}"/>
            <div class="form-field">
                <label for="protect-read-groups" th:text="#{protect.readGroups}">允许查看的身份</label>
                <select name="readGroups" id="protect-read-groups" class="wiki-protection-groups" multiple size="6">
                    <option value="__inherit__" th:selected="${protectReadGroups.contains('__inherit__')}" th:text="#{protect.inherit}"></option>
                    <option value="*" th:selected="${protectReadGroups.contains('*')}" th:text="#{protect.everyone}"></option>
                    <option value="__deny__" th:selected="${protectReadGroups.contains('__deny__')}" th:text="#{protect.deny}"></option>
                    <option th:each="group : ${protectionGroups}" th:value="${group}" th:text="${group}" th:selected="${protectReadGroups.contains(group)}"></option>
                </select>
            </div>
            <div class="form-field">
                <label for="protect-edit-groups" th:text="#{protect.editGroups}">允许编辑的身份</label>
                <select name="editGroups" id="protect-edit-groups" class="wiki-protection-groups" multiple size="6">
                    <option value="__inherit__" th:selected="${protectEditGroups.contains('__inherit__')}" th:text="#{protect.inherit}"></option>
                    <option value="*" th:selected="${protectEditGroups.contains('*')}" th:text="#{protect.everyone}"></option>
                    <option value="__deny__" th:selected="${protectEditGroups.contains('__deny__')}" th:text="#{protect.deny}"></option>
                    <option th:each="group : ${protectionGroups}" th:value="${group}" th:text="${group}" th:selected="${protectEditGroups.contains(group)}"></option>
                </select>
            </div>
            <p class="wiki-hint" th:text="#{protect.groupsHint}"></p>
            <div class="form-message" role="alert" hidden></div>
            <div class="form-actions">
                <button type="submit" class="wiki-button" th:text="#{protect.submit}">确认</button>
                <a class="wiki-button" th:href="@{/wiki/{t}(t=${sourceTitle})}"
                   th:text="#{common.back}">返回</a>
            </div>
        </form>
    </th:block>
</section>
</body>
</html>
