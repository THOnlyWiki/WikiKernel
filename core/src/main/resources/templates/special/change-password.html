<!DOCTYPE html>
<!-- 特殊:修改密码 / Special:ChangePassword（仿 MediaWiki 的 ChangeCredentials）：
     参数设置里「密码」一栏的白色按钮点进来就是本页；表单由 /js/change-password.js 提交到
     POST /api/user/preferences/password，成功后回到 returnto（默认 特殊:参数设置） -->
<html lang="zh" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body>
<section>
    <div class="wiki-auth change-password">
        <p class="wiki-warning" th:if="${changePasswordLogin}" th:text="#{changepassword.loginRequired}">
            请先登录后再修改密码。
        </p>

        <th:block th:unless="${changePasswordLogin}">
            <!-- 账号信息（线上是 OOUI 的「凭据类型 / 账号名称」两行） -->
            <dl class="change-password-account">
                <dt th:text="#{changepassword.credentialType}">凭据类型：</dt>
                <dd th:text="#{changepassword.credentialTypePassword}">基于密码的身份验证</dd>
                <dt th:text="#{changepassword.accountLabel}">账号名称：</dt>
                <dd th:text="${accountName}">用户名</dd>
            </dl>

            <form id="change-password-form" class="wiki-form">
                <div class="form-field">
                    <label for="cp-old-password" th:text="#{changepassword.current}">当前密码：</label>
                    <input type="password" id="cp-old-password" name="oldPassword"
                           autocomplete="current-password" required/>
                </div>
                <div class="form-field">
                    <label for="cp-new-password" th:text="#{preferences.password.new}">新密码：</label>
                    <input type="password" id="cp-new-password" name="newPassword"
                           autocomplete="new-password" required/>
                    <div class="wiki-hint" th:text="#{changepassword.newHint}">
                        建议您使用独一无二且从未在其他网站上使用过的密码。
                    </div>
                </div>
                <div class="form-field">
                    <label for="cp-confirm-password" th:text="#{preferences.password.confirm}">确认新密码：</label>
                    <input type="password" id="cp-confirm-password" name="confirmPassword"
                           autocomplete="new-password" required/>
                    <div class="wiki-hint" th:text="#{preferences.password.hint}">新密码至少 6 位。</div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="wiki-button" th:text="#{changepassword.submit}">更改密码</button>
                </div>
                <p id="change-password-message" class="form-message" role="alert" hidden></p>
            </form>

            <p class="auth-subtitle">
                <a th:href="${returnto}" th:text="#{changepassword.backToPrefs}">返回参数设置</a>
            </p>
        </th:block>
    </div>
</section>
</body>
</html>
