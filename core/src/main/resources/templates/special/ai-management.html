<!doctype html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" th:replace="~{__${skin.layout}__ :: layout(${title}, ~{:: section})}">
<body><section class="ai-management">
    <p><span th:text="#{ai.management.intro}"></span> <a th:href="${aiAgentUrl}" th:text="#{ai.management.openAgent}">打开词条 AI 代理</a></p>
    <p th:unless="${aiManager}" th:text="#{ai.management.managerOnly}">只有管理员或行政员可以配置站点 AI。</p>
    <div th:if="${aiManager}" data-ai-management>
        <p role="status" aria-live="polite" data-status></p>
        <h2 th:text="#{ai.management.providers}">站点接口</h2><div data-providers></div>
        <details><summary th:text="#{ai.management.addProvider}">添加接口</summary><form data-provider-form class="wiki-form">
            <label><span th:text="#{ai.management.id}">配置标识</span> <input name="id" required pattern="[a-z][a-z0-9-]{0,39}" placeholder="news-model"></label>
            <label><span th:text="#{ai.management.label}">显示名称</span> <input name="label" maxlength="80"></label>
            <label><span th:text="#{ai.management.protocol}">协议</span> <select name="type"><option value="openai" th:text="#{ai.management.openAiCompatible}">OpenAI 兼容</option><option value="anthropic">Anthropic</option><option value="gemini">Gemini</option></select></label>
            <label><span th:text="#{ai.management.baseUrl}">接口地址</span> <input name="baseUrl" type="url" placeholder="https://example.com/v1"></label>
            <label><span th:text="#{ai.management.model}">模型</span> <input name="model" required maxlength="120"></label>
            <label><span th:text="#{ai.management.apiKey}">API 密钥</span> <input name="apiKey" type="password" autocomplete="new-password"></label>
            <label><span th:text="#{ai.management.proxy}">代理</span> <input name="proxy" th:placeholder="#{ai.management.optional}"></label>
            <label><input name="allowPrivate" type="checkbox" value="true"> <span th:text="#{ai.management.allowPrivate}">允许此配置连接本机或内网服务</span></label>
            <button type="submit" th:text="#{ai.management.saveProvider}">保存接口</button>
        </form></details>
        <h2 th:text="#{ai.management.scenes}">使用场景</h2><div data-scenes></div>
        <h2 th:text="#{ai.management.agent}">词条编辑代理</h2>
        <form data-agent-policy-form class="wiki-form">
            <label><input name="enabled" type="checkbox" value="true"> <span th:text="#{ai.management.enableAgent}">启用 AI 词条编辑代理</span></label>
            <label><input name="allowNormal" type="checkbox" value="true"> <span th:text="#{ai.management.allowNormal}">允许普通登录用户使用</span></label>
            <p th:text="#{ai.management.agentHint}">词条对话与编辑功能由 AI 代理插件提供。</p>
            <button type="submit" th:text="#{ai.management.savePolicy}">保存代理权限</button>
        </form>
        <h2 th:text="#{ai.management.limits}">请求限额</h2>
        <form data-limits-form class="wiki-form">
            <label><span th:text="#{ai.management.concurrency}">同时运行的请求数</span><input name="concurrency" type="number" min="1" max="4" required></label>
            <label><span th:text="#{ai.management.dailyCalls}">每天最多请求数（UTC 日界）</span><input name="dailyCalls" type="number" min="1" max="10000" required></label>
            <label><span th:text="#{ai.management.timeout}">单次请求超时（秒）</span><input name="timeout" type="number" min="5" max="300" required></label>
            <button type="submit" th:text="#{ai.management.saveLimits}">保存限额</button>
        </form>
        <h2 th:text="#{ai.management.calls}">最近调用</h2><div data-calls></div>
    </div>
    <link rel="stylesheet" href="/css/ai-management.css">
    <script th:inline="javascript">
        window.wikiAiManagementLabels = {
            failed: /*[[#{ai.management.failed}]]*/ '',
            configFile: /*[[#{ai.management.configFile}]]*/ '',
            unconfigured: /*[[#{ai.management.unconfigured}]]*/ '',
            label: /*[[#{ai.management.label}]]*/ '',
            baseUrl: /*[[#{ai.management.baseUrl}]]*/ '',
            model: /*[[#{ai.management.model}]]*/ '',
            replaceKey: /*[[#{ai.management.replaceKey}]]*/ '',
            proxy: /*[[#{ai.management.proxy}]]*/ '',
            allowPrivate: /*[[#{ai.management.allowPrivate}]]*/ '',
            clearCredentials: /*[[#{ai.management.clearCredentials}]]*/ '',
            save: /*[[#{ai.management.save}]]*/ '',
            activity: /*[[#{ai.management.activity}]]*/ '',
            news: /*[[#{ai.management.news}]]*/ '',
            providers: /*[[#{ai.management.providers}]]*/ '',
            choose: /*[[#{ai.management.choose}]]*/ '',
            groups: /*[[#{ai.management.groups}]]*/ '',
            enabled: /*[[#{ai.management.enabled}]]*/ '',
            saveScene: /*[[#{ai.management.saveScene}]]*/ '',
            test: /*[[#{ai.management.test}]]*/ '',
            saved: /*[[#{ai.management.saved}]]*/ ''
        };
    </script>
    <script defer src="/js/ai-management.js?v=2"></script>
</section></body></html>
