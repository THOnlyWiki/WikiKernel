version.tag.ref.usage=<ref>出处</ref>：给正文加脚注；配合 <references /> 显示脚注列表。
version.tag.ref.description=属性：name（命名脚注；先写 <ref name="x">内容</ref>，再用 <ref name="x" /> 复用）；标签之间的 wikitext 就是脚注内容。
version.tag.references.usage=<references />：在页面中显示脚注列表（通常是「脚注」小节）。
version.tag.references.description=别名：<reference />（行为一致）；没有属性。
version.tag.nowiki.usage=<nowiki>文本</nowiki>：原样输出，不解析 wikitext。
version.tag.pre.usage=<pre>文本</pre>：等宽预排版，保留空格与换行。
version.tag.poem.usage=<poem>诗句</poem>：按行断行、保留缩进，行内仍解析 wikitext。
version.tag.gallery.usage=<gallery>文件:甲.jpg|说明（每行一张）</gallery>：图片画廊。
version.tag.gallery.description=属性：widths（图片最大宽度，默认 120）、heights（最大高度）、perrow（每行几张）、mode（traditional / nolines / packed）、caption、class；文件名可写「文件:甲.jpg」或直接「甲.jpg」，不存在的文件显示红链。
version.tag.syntaxhighlight.usage=<syntaxhighlight lang="java">代码</syntaxhighlight>：带语法高亮的代码块。
version.tag.syntaxhighlight.description=参数：lang（java / kotlin / javascript / typescript / css / json / xml / html / python / bash / sql / properties / lua / markdown / wikitext，可用简写 js / ts / kt / py / sh / htm / md 等）；<source lang="…"> 是旧名，行为一致。
version.tag.markdown.usage=<markdown># 标题</markdown>：把内容按 Markdown 渲染。
version.tag.markdown.description=支持标题、列表、引用、围栏代码块（```lang）、GFM 表格、删除线、链接与图片；行内 HTML 按白名单过滤。
version.tag.math.usage=<math>公式</math>：TeX 数学公式（KaTeX 渲染）。
version.tag.math.description=参数：display="inline|block"（默认 inline）；<chem>分子式</chem> 写化学式（\\ce{…} 语法）。
version.tag.timeline.usage=<timeline>Period = from:… till:…</timeline>：EasyTimeline 时间线（常用子集），渲染成内联 SVG。
version.tag.timeline.description=支持 ImageSize / PlotArea / AlignBars / DateFormat / Period / TimeAxis / ScaleMajor / ScaleMinor / Colors / BackgroundColors / Legend / PlotData / TextData 等命令；未实现的 LineData 按原版注释忽略。
version.tag.graph.usage=<graph>{…Vega 规范…}</graph>：Vega / Vega-Lite 图表。
version.tag.graph.description=参数：title（图注）、width / height；标签内容是 Vega 规范 JSON，用本站内置的 Vega 渲染（无外部服务）。
version.tag.comment.usage=<comment />：在该页面底部显示评论区（发表 / 回复）。
version.tag.comment.description=别名：<comments />；没有属性。
version.tag.categorytree.usage=<categorytree>分类名</categorytree>：显示该分类的成员树。
version.tag.categorytree.description=属性：mode（categories / pages / all / parents）、depth（默认 1）、hideroot、hideprefix、showcount、namespaces、class、style。
version.tag.seo.usage=<seo>title=标题|description=描述</seo>：给页面写 SEO 元数据（也支持标签属性写法，如 <seo title="…">）。
version.tag.seo.description=键（与 WikiSEO 一致）：title / title_mode / title_separator / keywords / description / canonical / robots / googlebot / image / image_width / image_height / image_alt / type / site_name / locale / section / author / published_time / twitter_site / twitter_card；description=auto 交给系统自动生成。
version.tag.inputbox.usage=<inputbox>type=create</inputbox>：创建 / 搜索框（标签内容每行一个 key=value）。
version.tag.inputbox.description=键：type（create 默认 / search / fulltext）、default、placeholder、id、buttonlabel、width、prefix、preload、editintro（建页时预载 / 提示）。
version.tag.flash-player.usage=<flash-player file="演示.swf" width="320" height="240">说明文字</flash-player>：内嵌 Flash 播放器（Ruffle）。
version.tag.flash-player.description=属性：file（外部 URL / [[文件:X.swf]] / 文件名）；width（默认 550）、height（400）、autoplay（默认 true）、loop（默认 false）、fullscreen、letterbox、menu、bgcolor、quality、scale、wmode、allowscriptaccess、unmute、flashvars、base、caption；标签内容也是说明文字。
version.tag.templatedata.usage=<templatedata>{…JSON…}</templatedata>：给模板声明参数（可视化编辑与文档用）。
version.tag.templatedata.description=标签内容是原始 JSON（description / params / paramOrder 等，与 MediaWiki TemplateData 相同）；校验通过后写入页面属性并渲染参数表。
version.tag.exclude-banner-page.usage=<exclude-banner-page />：让本页不显示页面横幅。
version.tag.indicator.usage=<indicator name="例子">[[文件:图标.png|20px]]</indicator>：页面状态指示器（标题右上角的小图标）。
version.tag.indicator.description=属性：name（必填，同名只显示一个）；内容按行内 wikitext 解析，通常放小图标（例如 [[文件:星星.png|20px|link=]]）。
