version.tag.nowiki.usage=<nowiki>テキスト</nowiki>：Wiki 構文を解釈せず、そのまま表示します。
version.tag.pre.usage=<pre>テキスト</pre>：空白や改行を保ったまま等幅フォントで表示します。
version.tag.poem.usage=<poem>テキスト</poem>：改行と字下げを保ちます。行内の Wiki 構文は解釈されます。
version.tag.gallery.usage=<gallery>File:a.jpg|説明</gallery>：画像を一覧表示します。タグ内に1行ずつ画像を指定します。
version.tag.gallery.description=属性:幅(最大画像幅、デフォルト120)、高さ(最大高さ)、パーロー(行ごとの項目)、モード(固有の/ノライン/パック)、キャプション、クラス。 行は「File:a.jpg」または「a.jpg」で始まるかもしれません。 欠落したファイルは赤いリンクとしてレンダリングされます。
version.tag.syntaxhighlight.usage=<syntaxhighlight lang="java">コード</syntaxhighlight>：構文を色分けしたコードブロックを表示します。
version.tag.syntaxhighlight.description=パラメーター: lang (java/kotlin/javascript/typescript/css/json/xml/html/python/bash/sql/プロパティ/ lua/markdown/wikitext; ショートフォームjs/ts/kt/py/sh/htm/mdは受け付けます)。 <source lang="…"> 同じ行動を持つレガシー名です。
version.tag.markdown.usage=<markdown># 見出し</markdown>：Markdown を表示します。
version.tag.markdown.description=見出し、リスト、引用符、フェンスコードブロック(```````lang)、GFMテーブル、ストライクスルー、リンク、画像をサポートしています。インラインHTMLは、許可リストを介してフィルタリングされます。
version.tag.math.usage=<math>x^2</math>：TeX の数式を KaTeX で表示します。
version.tag.math.description=パラメーター: display="inline|block" (デフォルトインライン)。 <chem>仕様書</chem> 化学式を書く(化学式)\\ce{...} 構文)。
version.tag.timeline.usage=<timeline>Period = from:… till:…</timeline>：EasyTimeline の基本構文から SVG の年表を表示します。
version.tag.timeline.description=ImageSize / PlotArea / AlignBar / DateFormat / 期間 / TimeAxis / ScaleMajor / スケールマイナー / 色 / 背景色 / 伝説 / PlotData / テキストデータ; 未導入のLineDataは元のように無視されます。
version.tag.graph.usage=<graph>{…Vega spec…}</graph>：Vega または Vega-Lite のグラフを表示します。
version.tag.graph.description=パラメーター: title(キャプション)、幅/高さ。タグの内容は、バンドルされたVegaでレンダリングされたVega spec JSONで、外部サービスはありません。
version.tag.comment.usage=<comment />：ページ下部にコメント欄を表示します。
version.tag.comment.description=別名で: <comments />. 属性はありません。
version.tag.categorytree.usage=<categorytree>カテゴリ名</categorytree>：指定したカテゴリに属する項目をツリー表示します。
version.tag.categorytree.description=属性: モード(カテゴリ/ページ/すべての/両親)、深さ(デフォルト1)、hideroot、hideprefix、showcount、名前空間、クラス、スタイル。
version.tag.seo.usage=<seo>title=タイトル|description=説明</seo>：ページの SEO メタデータを指定します。<seo title="…"> のように属性でも指定できます。
version.tag.seo.description=キー(WikiSEOと同じ):タイトル/title_mode/title_separator/キーワード/説明/canonical/ロボット/Googlebot/イメージ/image_width/image_alt/type/site_name/locale/セクション/作者/published_time/twitter_site/twitter_card; description=autoはwikiを生成させます。
version.tag.inputbox.usage=<inputbox>type=create</inputbox>：ページ作成欄や検索欄を表示します。タグ内に key=value 形式で1行ずつ設定します。
version.tag.inputbox.description=キー: タイプ(デフォルト/検索/フルテキストで作成)、デフォルト、プレースホルダー、id、ボタンラベル、幅、プレフィックス、プリロード、編集イントロ(ページ作成のプレロード/イントロ)。
version.tag.flash-player.usage=<flash-player file="demo.swf" width="320" height="240">説明</flash-player>：Ruffle で Flash プレーヤーを埋め込みます。
version.tag.flash-player.description=属性: ファイル (外部 URL / [[File:X.swf]] /ファイル名);幅(デフォルト550)、高さ(400)、オートプレイ(デフォルトtrue)、ループ(デフォルトfalse)、フルスクリーン、レターボックス、メニュー、bgcolor、品質、スケール、wmode、allowscriptaccess、unmute、フラッシュバー、ベース、キャプション。タグコンテンツもキャプションです。
version.tag.templatedata.usage=<templatedata>{…JSON…}</templatedata>：ビジュアルエディターと説明ページで使うテンプレート引数を定義します。
version.tag.templatedata.description=タグのコンテンツは、MediaWiki TemplateDataと同じフォーマットである生のJSON(description / params / paramOrder ...)です。 成功すると、ページプロパティとして保存され、パラメータテーブルがレンダリングされます。
version.tag.exclude-banner-page.usage=<exclude-banner-page />：このページのバナーを非表示にします。
version.tag.indicator.usage=<indicator name="example">[[File:icon.png|20px]]</indicator>：タイトルの右上に状態を表す小さなアイコンを表示します。
version.tag.indicator.description=Attribute: 名前 (必須; 名前ごとに1つのインジケータのみ)。 コンテンツは、インラインwikitextとしてパースされ、通常は小さなアイコン(例えば)です。 [[File:star.png|20px|link=]]).
