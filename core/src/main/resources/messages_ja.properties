version.tag.ref.usage=<ref>出典</ref>：脚注を追加します。<references /> で脚注一覧を表示できます。
version.tag.ref.description=Attribute: 名前 (フットノートの名前); と定義します <ref name="x">テキスト</ref>、再使用 <ref name="x" />)。タグ間のwikitextはフットノートテキストです。
