# The four backend option labels reuse the site-settings keys settings.cachePageBackend* (same enum).
setup.section.cache=Cache (optional)
setup.cache.intro=The page content cache is off by default (safe out of the box): rendered bodies are cached by title + revision id, so any edit changes the id and stale content is never returned. TTL, entry limit and template-change pre-rendering live in Special:AccessControl -> Site settings.
