setup.cache.hint=When the connection is unavailable: an unreachable Redis falls back to the in-process cache automatically (pages still render, no errors) and a warning is logged; nothing is cached when the backend is none or the switch is off. The switch and backend apply immediately after saving; Redis host / port / database / password / key prefix are written to LocalSettings.yaml and apply after a restart (the password is only written to the config file, never to the logs).
