version.parserTags=Parser tags
version.parserTags.intro=Parser tags available on this wiki. Click a tag name to see usage and parameters.
version.parserTags.source.core=WikiKernel core
version.parserTags.source.other=Other plugins
version.parserTags.table.tag=Tag
version.parserTags.table.usage=Description
version.parserTags.sourceLabel=Source
version.parserTags.aliases=Aliases
version.parserTags.usage=Usage
version.parserTags.params=Parameters
version.tag.ref.usage=<ref>source</ref>: adds a footnote; pair with <references /> to render the footnote list.
version.tag.ref.description=Attribute: name (named footnote; define with <ref name="x">text</ref>, reuse with <ref name="x" />). The wikitext between the tags is the footnote text.
version.tag.references.usage=<references />: renders the footnote list (usually under a "Footnotes" heading).
version.tag.references.description=Alias: <reference /> (same behaviour). No attributes.
version.tag.nowiki.usage=<nowiki>text</nowiki>: output verbatim, no wikitext parsing.
version.tag.pre.usage=<pre>text</pre>: monospaced preformatted block, keeps spaces and line breaks.
version.tag.poem.usage=<poem>lines</poem>: breaks lines and keeps indentation; inline wikitext is still parsed.
version.tag.gallery.usage=<gallery>File:a.jpg|caption (one per line)</gallery>: image gallery.
version.tag.gallery.description=Attributes: widths (max image width, default 120), heights (max height), perrow (items per row), mode (traditional / nolines / packed), caption, class. A line may start with "File:a.jpg" or just "a.jpg"; missing files render as red links.
version.tag.syntaxhighlight.usage=<syntaxhighlight lang="java">code</syntaxhighlight>: syntax highlighted code block.
version.tag.syntaxhighlight.description=Parameter: lang (java / kotlin / javascript / typescript / css / json / xml / html / python / bash / sql / properties / lua / markdown / wikitext; short forms js / ts / kt / py / sh / htm / md are accepted). <source lang="…"> is the legacy name with the same behaviour.
version.tag.markdown.usage=<markdown># Heading</markdown>: renders the content as Markdown.
version.tag.markdown.description=Supports headings, lists, quotes, fenced code blocks (```lang), GFM tables, strikethrough, links and images; inline HTML is filtered through the allow-list.
version.tag.math.usage=<math>formula</math>: TeX math (rendered by KaTeX).
version.tag.math.description=Parameter: display="inline|block" (default inline). <chem>formula</chem> writes a chemical formula (\\ce{…} syntax).
version.tag.timeline.usage=<timeline>Period = from:… till:…</timeline>: EasyTimeline (common subset) rendered as inline SVG.
version.tag.timeline.description=Supports ImageSize / PlotArea / AlignBars / DateFormat / Period / TimeAxis / ScaleMajor / ScaleMinor / Colors / BackgroundColors / Legend / PlotData / TextData; the unimplemented LineData is ignored like in the original.
version.tag.graph.usage=<graph>{…Vega spec…}</graph>: Vega / Vega-Lite chart.
version.tag.graph.description=Parameters: title (caption), width / height. The tag content is a Vega spec JSON rendered with the bundled Vega, no external service.
version.tag.comment.usage=<comment />: shows the comment section at the bottom of the page.
version.tag.comment.description=Alias: <comments />. No attributes.
version.tag.categorytree.usage=<categorytree>Category name</categorytree>: shows the member tree of that category.
version.tag.categorytree.description=Attributes: mode (categories / pages / all / parents), depth (default 1), hideroot, hideprefix, showcount, namespaces, class, style.
version.tag.seo.usage=<seo>title=Title|description=Description</seo>: writes SEO metadata for the page (attributes are also accepted, e.g. <seo title="…">).
version.tag.seo.description=Keys (same as WikiSEO): title / title_mode / title_separator / keywords / description / canonical / robots / googlebot / image / image_width / image_height / image_alt / type / site_name / locale / section / author / published_time / twitter_site / twitter_card; description=auto lets the wiki generate it.
version.tag.inputbox.usage=<inputbox>type=create</inputbox>: create / search box (one key=value per line inside the tag).
version.tag.inputbox.description=Keys: type (create by default / search / fulltext), default, placeholder, id, buttonlabel, width, prefix, preload, editintro (preload / intro for page creation).
version.tag.flash-player.usage=<flash-player file="demo.swf" width="320" height="240">caption text</flash-player>: embedded Flash player (Ruffle).
version.tag.flash-player.description=Attributes: file (external URL / [[File:X.swf]] / file name); width (default 550), height (400), autoplay (default true), loop (default false), fullscreen, letterbox, menu, bgcolor, quality, scale, wmode, allowscriptaccess, unmute, flashvars, base, caption; the tag content is also the caption.
version.tag.templatedata.usage=<templatedata>{…JSON…}</templatedata>: declares template parameters for the visual editor and documentation.
version.tag.templatedata.description=The tag content is raw JSON (description / params / paramOrder …), the same format as MediaWiki TemplateData; on success it is stored as a page property and a parameter table is rendered.
version.tag.exclude-banner-page.usage=<exclude-banner-page />: hides the page banner on this page.
version.tag.indicator.usage=<indicator name="example">[[File:icon.png|20px]]</indicator>: page status indicator (a small icon at the top right of the title).
version.tag.indicator.description=Attribute: name (required; only one indicator per name). The content is parsed as inline wikitext, usually a small icon (e.g. [[File:star.png|20px|link=]]).
