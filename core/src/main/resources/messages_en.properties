special.accessControl=Access control
access.intro=Configure who can read / edit / create / move / protect / delete pages. Changes take effect immediately.
access.hint=Matching priority: exact title > longest prefix (ending with *, e.g. Help:*) > all (*). Once a rule matches, no further matching happens. "Selected groups" means any one of them; "Everyone" includes anonymous users; "Nobody" denies.
access.hintLocalSettings=You can also define default rules in LocalSettings.yaml under wikikernel.permissions.rules: they are imported at every startup and overwrite web changes for the same target + action.
access.hintUpsert=Saving the same target + action again overwrites the old rule; that is how you edit a rule.
