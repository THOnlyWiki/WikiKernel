categorytree-showcount-label=显示成员计数
categorytree-collapse=折叠
categorytree-expand=展开
categorytree-member-counts=含有 $1 个子分类、$2 个页面和 $3 个文件
categorytree-member-num=($5)
categorytree-num-categories=$1个分类
