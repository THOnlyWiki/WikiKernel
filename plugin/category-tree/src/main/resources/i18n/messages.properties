# 分类树（插件 category-tree）—— 默认语言（中文）
# 键名与迁移前 Java 消息表（挑自原扩展 i18n/）保持一致，$1 / $2 占位符沿用 MediaWiki 写法；漏翻的键会显示键名
plugin.category-tree.name=分类树（CategoryTree）
plugin.category-tree.description=移植自 MediaWiki CategoryTree：分类树标签与解析器函数、AJAX 展开、action=categorytree API 与「特殊\:分类树」

# 安装向导（/init）里的插件设置
setup.category-tree.description=分类树\：<categorytree> / {{#categorytree}}、「特殊\:分类树」与 action\=categorytree API。
setup.category-tree.allow-tag=启用解析入口（标签与解析器函数）
setup.category-tree.max-children=每个节点最多显示的成员数
setup.category-tree.max-depth-categories=mode\=categories 的最大展开深度
setup.category-tree.max-depth-pages=mode\=pages 的最大展开深度
setup.category-tree.max-depth-all=mode\=all / parents 的最大展开深度
setup.category-tree.default-mode=默认模式
setup.category-tree.default-hideprefix=默认隐藏命名空间前缀
setup.category-tree.default-showcount=默认显示成员计数
setup.category-tree.saved=已保存 CategoryTree 设置（重启后生效）。

