# 页面横幅（插件 page-banner）—— 默认语言（中文），UTF-8 无 BOM
# 键名风格与迁移前 core 的 messages.properties 一致；漏翻的键由 core 回退成翻译键本身
plugin.page-banner.name=页面横幅
plugin.page-banner.description=页面标题上方的横幅图片轮播（{{PAGEBANNER\:文件名|caption\=说明}} / <exclude-banner-page />）

pageBanner.rotation.stable=固定（按标题哈希）
pageBanner.rotation.random=每次浏览随机
pageBanner.rotation.rotate=每次浏览顺序轮换
pageBanner.rotation.daily=每天换一张
pageBanner.rotation.hourly=每小时换一张

# 轮播设置项（站点设置的 key 是 features.page-banner.interval / .transition / .controls / .pause-on-hover；
# core 的「特殊\:权限配置 → 站点设置」与 /init 表单新增这些字段时用这里的名称与说明）
pageBanner.interval=自动翻页间隔（秒）
pageBanner.intervalHint=每隔多少秒切到下一张；0 表示不自动翻页（默认 5 秒）
pageBanner.transition=过渡效果
pageBanner.transition.fade=淡入淡出
pageBanner.transition.slide=横向滑动
pageBanner.transitionHint=切换图片时的动画效果（默认淡入淡出）
pageBanner.controls=显示翻页控件
pageBanner.controlsHint=显示「上一张 / 下一张」按钮与指示点（默认显示；只有一张图片时不显示）
pageBanner.pauseOnHover=悬停时暂停
pageBanner.pauseOnHoverHint=鼠标悬停或键盘焦点落在横幅上时暂停自动翻页（默认暂停）

# 轮播控件的文案（服务端经 data-* 属性与 window.WIKI_MESSAGES 交给 page-banner.js；{0} = 第几张）
pageBanner.prev=上一张
pageBanner.next=下一张
pageBanner.goto=跳到第 {0} 张
pageBanner.status=第 {0} 张
pageBanner.region=页面横幅图片

# ---- settings section / setup wizard (plugin-owned; same keys as before migration) ----
setup.pageBannerHint=在页面标题上方显示横幅图片；页面可用 <exclude-banner-page /> 排除。
setup.pageBannerFiles=横幅图片池（文件名，多个用 | 分隔）
setup.pageBannerWhitelistEnabled=白名单模式：只对下列页面显示横幅
setup.pageBannerWhitelist=横幅白名单页面（多个用 | 分隔）
setup.pageBannerRotation=轮换机制
setup.pageBannerPerPage=逐页配置（页面=文件名，| 分隔）
settings.pageBannerHint=在页面标题上方显示横幅；页面可用 {{PAGEBANNER:文件名}} 指定，或从图片池按标题稳定选取；<exclude-banner-page /> 可排除。
settings.pageBannerFiles=横幅图片池（文件名，多个用 | 分隔，留空表示无默认横幅）
settings.pageBannerWhitelistEnabled=白名单模式：只对白名单页面显示横幅
settings.pageBannerWhitelist=横幅白名单页面（每行一个，也可用 | 分隔）
settings.pageBannerRotation=轮换机制
settings.pageBannerRotationHint=固定（按标题哈希，默认）/ 每次浏览随机 / 每次浏览顺序轮换 / 每天换一张 / 每小时换一张。
settings.pageBannerPerPage=逐页配置（每行一个：页面标题 = 横幅文件名）
settings.pageBannerPerPageHint=只写标题 = 该页从图片池按轮换机制取；配过的页面自动视为要显示横幅（无需再加进白名单）。
settings.pageBannerInterval=自动翻页间隔（秒，0 = 不自动翻页）
settings.pageBannerTransition=过渡效果
settings.pageBannerTransitionFade=淡入淡出
settings.pageBannerTransitionSlide=横向滑动
settings.pageBannerControls=显示翻页控件（上一张 / 下一张 + 指示点）
settings.pageBannerPauseOnHover=鼠标悬停时暂停自动翻页
setup.pageBanner=页面横幅（WikidataPageBanner）
settings.pageBanner=页面横幅（WikidataPageBanner）
settings.pageBannerEnabled=启用页面横幅
setup.pageBannerSaved=页面横幅设置已写入 LocalSettings.yaml（重启后生效）

