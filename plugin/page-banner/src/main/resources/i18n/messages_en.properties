# Page banner (plugin page-banner) - English, UTF-8 without BOM
plugin.page-banner.name=Page banner (WikidataPageBanner)
plugin.page-banner.description=Banner image carousel above the page title, configured per page with {{PAGEBANNER\:...}}

pageBanner.rotation.stable=Stable (title hash)
pageBanner.rotation.random=Random on each view
pageBanner.rotation.rotate=Sequential rotation on each view
pageBanner.rotation.daily=Rotate daily
pageBanner.rotation.hourly=Rotate hourly

# Carousel settings (site setting keys features.page-banner.interval / .transition / .controls / .pause-on-hover)
pageBanner.interval=Auto-advance interval (seconds)
pageBanner.intervalHint=Seconds between slides; 0 disables auto-advance (default 5)
pageBanner.transition=Transition effect
pageBanner.transition.fade=Fade
pageBanner.transition.slide=Slide
pageBanner.transitionHint=Animation used when switching slides (default fade)
pageBanner.controls=Show carousel controls
pageBanner.controlsHint=Show previous / next buttons and slide dots (default on; hidden when there is a single image)
pageBanner.pauseOnHover=Pause on hover
pageBanner.pauseOnHoverHint=Pause auto-advance while the pointer hovers or the keyboard focus is inside the banner (default on)

# Carousel control labels (sent to page-banner.js through data-* attributes and window.WIKI_MESSAGES; {0} = slide number)
pageBanner.prev=Previous slide
pageBanner.next=Next slide
pageBanner.goto=Go to slide {0}
pageBanner.status=Slide {0}
pageBanner.region=Page banner image

# ---- settings section / setup wizard (plugin-owned; same keys as before migration) ----
setup.pageBannerHint=Show a banner image above the page title; a page can opt out with <exclude-banner-page />.
setup.pageBannerFiles=Banner image pool (file names, separated by |)
setup.pageBannerWhitelistEnabled=Whitelist mode: only the listed pages show a banner
setup.pageBannerWhitelist=Banner whitelist pages (separated by |)
setup.pageBannerRotation=Rotation
setup.pageBannerPerPage=Per-page banners (page=file, separated by |)
settings.pageBannerHint=Show a banner above the page title; a page may set one with {{PAGEBANNER:File name}}, otherwise one is picked from the pool by title; <exclude-banner-page /> opts out.
settings.pageBannerFiles=Banner image pool (file names, separated by |; empty means no default banner)
settings.pageBannerWhitelistEnabled=Whitelist mode: only whitelisted pages show a banner
settings.pageBannerWhitelist=Banner whitelist pages (one per line, or separated by |)
settings.pageBannerRotation=Rotation
settings.pageBannerRotationHint=Stable (title hash, default) / Random on each view / Sequential rotation on each view / Rotate daily / Rotate hourly.
settings.pageBannerPerPage=Per-page banners (one per line: page title = file name)
settings.pageBannerPerPageHint=A bare title uses the pool with the rotation setting; pages listed here automatically show a banner (no whitelist entry needed).
settings.pageBannerInterval=Auto-advance interval in seconds (0 disables auto-advance)
settings.pageBannerTransition=Transition effect
settings.pageBannerTransitionFade=Fade
settings.pageBannerTransitionSlide=Slide
settings.pageBannerControls=Show carousel controls (previous / next and dots)
settings.pageBannerPauseOnHover=Pause auto-advance while hovering
