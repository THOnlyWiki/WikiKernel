# Flash 播放器（插件 flash-player）—— 默认语言（中文）
# 键名与迁移前 core 的 flashPlayer.* 一致；core 里暂时还有同名键（core 优先），漏翻的键会直接显示键名
plugin.flash-player.name=Flash 播放器（Ruffle）
plugin.flash-player.description=用 Ruffle 在页面内播放 Flash（<flash-player> 标签，从 core 拆出的插件）

flashPlayer.disabled=（Flash 播放器未启用）
flashPlayer.missingFile=flash-player：缺少 file 参数（[[文件:X.swf]] 或 URL）
flashPlayer.unavailable=flash-player：无法解析文件（独立渲染环境）
flashPlayer.missing=flash-player：文件不存在：
flashPlayer.playFailed=Flash 播放失败：
flashPlayer.clickToPlay=▶ 点击播放 Flash
flashPlayer.ruffleNotReady=RufflePlayer 未初始化
flashPlayer.loadFailed=无法加载 Ruffle：
