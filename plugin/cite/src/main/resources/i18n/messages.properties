# Cite 扩展（插件 cite）——默认语言（中文）
plugin.cite.name=引用（Cite）
plugin.cite.description=&lt;ref&gt;…&lt;/ref&gt; 与 &lt;references /&gt; 脚注（MediaWiki Cite 移植，从 core 拆出）

cite.error.empty=引用错误：<ref> 没有内容
cite.error.unnamedUse=引用错误：<ref/> 需要 name 属性
cite.error.undefined=引用错误：名为「$1」的引用尚未定义
cite.error.duplicate=引用错误：名为「$1」的引用重复定义（内容不同）
