# Cite extension (plugin: cite) — English
plugin.cite.name=Cite
plugin.cite.description=Citations via <ref>…</ref> and <references /> (MediaWiki Cite port, extracted from core)

cite.error.empty=Cite error: <ref> has no content
cite.error.unnamedUse=Cite error: <ref/> requires a name attribute
cite.error.undefined=Cite error: no reference defined with name "$1"
cite.error.duplicate=Cite error: reference name "$1" is defined more than once with different content
