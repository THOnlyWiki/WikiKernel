plugin.cpu-guard.name=CPU Guard
plugin.cpu-guard.description=Debian cgroup v2 CPU quota and affinity for the JVM.
cpuGuard.title=CPU quota and core affinity
cpuGuard.description=Default: 25% of one CPU, bound to one core. Settings apply within 5 seconds. machine=whole VPS; single-core=one CPU. Requires a dedicated cgroup v2. Use the bundled systemd launcher to enforce limits from JVM startup.
cpuGuard.enabled=Enable OS CPU quota
cpuGuard.percent=CPU percent (1-30; default and invalid-value fallback: 25)
cpuGuard.basis=Accounting basis (machine=whole VPS; single-core=one CPU)
cpuGuard.cores=Bound CPU count (default 1; 0=quota only; capped at available CPUs)
cpuGuard.machineCpus=VPS vCPU count (default 2; 0=auto; specify the actual allocation in containers)
cpuGuard.notEnforced=LIMIT NOT ENFORCED
cpuGuard.quotaActive=OS CPU quota active
cpuGuard.affinity=CPU affinity
cpuGuard.actualCap=Actual whole-machine quota
cpuGuard.disabled=Disabled (external systemd limits remain active)
cpuGuard.affinityDisabled=Not enabled
