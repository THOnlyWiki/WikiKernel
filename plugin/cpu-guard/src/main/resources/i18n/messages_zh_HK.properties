# WikiKernel interface messages

plugin.cpu-guard.name=CPU 限額與鎖核
plugin.cpu-guard.description=Debian cgroup v2 JVM 整進程 CPU 配額與核心綁定。
cpuGuard.title=CPU 限額與鎖核
cpuGuard.description=默認按單核 25% 限額並綁定 1 核，設置在 5 秒內應用；machine=整台 VPS，single-core=單核。需要 JVM 獨佔的 cgroup v2；生產建議使用插件附帶的 systemd 啓動器，從 JVM 啓動時就限額。
cpuGuard.enabled=啓用系統級 CPU 配額
cpuGuard.percent=CPU 百分比（1–30，默認 25；非法值回退到 25）
cpuGuard.basis=百分比口徑（machine=整台 VPS；single-core=單核）
cpuGuard.cores=綁定的核心數（默認 1；0=僅限額；超過可用數時取可用數）
cpuGuard.machineCpus=VPS vCPU 總數（默認 2；0=自動；容器中請填寫實際 VPS vCPU 數）
cpuGuard.notEnforced=限制未生效
cpuGuard.quotaActive=系統級 CPU 配額已生效
cpuGuard.affinity=核心綁定
cpuGuard.actualCap=實際整機配額
cpuGuard.disabled=已關閉（外部 systemd 上限仍然生效）
cpuGuard.affinityDisabled=未啓用
