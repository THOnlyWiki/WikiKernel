# WikiKernel interface messages

plugin.cpu-guard.name=CPU 限額與鎖核
plugin.cpu-guard.description=Debian cgroup v2 JVM 整程序 CPU 配額與核心繫結。
cpuGuard.title=CPU 限額與鎖核
cpuGuard.description=預設按單核 25% 限額並繫結 1 核，設定在 5 秒內應用；machine=整臺 VPS，single-core=單核。需要 JVM 獨佔的 cgroup v2；生產建議使用外掛附帶的 systemd 啟動器，從 JVM 啟動時就限額。
cpuGuard.enabled=啟用系統級 CPU 配額
cpuGuard.percent=CPU 百分比（1–30，預設 25；非法值回退到 25）
cpuGuard.basis=百分比口徑（machine=整臺 VPS；single-core=單核）
cpuGuard.cores=繫結的核心數（預設 1；0=僅限額；超過可用數時取可用數）
cpuGuard.machineCpus=VPS vCPU 總數（預設 2；0=自動；容器中請填寫實際 VPS vCPU 數）
cpuGuard.notEnforced=限制未生效
cpuGuard.quotaActive=系統級 CPU 配額已生效
cpuGuard.affinity=核心繫結
cpuGuard.actualCap=實際整機配額
cpuGuard.disabled=已關閉（外部 systemd 上限仍然生效）
cpuGuard.affinityDisabled=未啟用
