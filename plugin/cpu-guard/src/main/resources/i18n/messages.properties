plugin.cpu-guard.name=CPU 限额与锁核
plugin.cpu-guard.description=Debian cgroup v2 JVM 整进程 CPU 配额与核心绑定。
cpuGuard.title=CPU 限额与锁核
cpuGuard.description=默认按单核 25% 限额并绑定 1 核，设置在 5 秒内应用；machine=整台 VPS，single-core=单核。需要 JVM 独占的 cgroup v2；生产建议使用插件附带的 systemd 启动器，从 JVM 启动时就限额。
cpuGuard.enabled=启用系统级 CPU 配额
cpuGuard.percent=CPU 百分比（1–30，默认 25；非法值回退到 25）
cpuGuard.basis=百分比口径（machine=整台 VPS；single-core=单核）
cpuGuard.cores=绑定的核心数（默认 1；0=仅限额；超过可用数时取可用数）
cpuGuard.machineCpus=VPS vCPU 总数（默认 2；0=自动；容器中请填写实际 VPS vCPU 数）
cpuGuard.notEnforced=限制未生效
cpuGuard.quotaActive=系统级 CPU 配额已生效
cpuGuard.affinity=核心绑定
cpuGuard.actualCap=实际整机配额
cpuGuard.disabled=已关闭（外部 systemd 上限仍然生效）
cpuGuard.affinityDisabled=未启用
