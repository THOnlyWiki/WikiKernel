plugin.ai-agent.name=AI 代理
plugin.ai-agent.description=多廠商對話 + 只讀工具 + 待確認提案（特殊\:AI代理 + /api/ai-agent/* + /api/ai-keys/*）
special.aiAgent=AI 代理
aiAgent.disabledHint=AI 代理功能未啓用：可在 /init 安裝嚮導或 特殊\:權限配置 → 站點設置 裏打開（features.ai-agent）。
aiAgent.loginRequired=AI 代理需要登入後使用。
aiAgent.notAllowedHint=你沒有使用 AI 代理的權限：需要「{0}」用戶組，或由管理員放開普通用戶（特殊\:AI代理?keys\=1 → 「允許普通用戶使用」，即 ai-agent.allow-normal-users）。
aiAgent.noProviderHint=還沒有可用的 AI 廠商：內置的「演示模式（固定回覆）」隨時可用（回覆是預先寫好的固定示例，不是真實 AI，不需要密鑰）；要接入真實模型，請在 參數設置 → AI 代理 填自己的密鑰（或讓管理員在 特殊\:AI代理?keys\=1 裏填站點密鑰）。
aiAgent.intro=AI 代理可以閱讀詞條與模板、按你的要求起草或修改內容；任何編輯都要你核對預覽與差異後確認才會保存，保存以你的名義進行、不經審核隊列，詞條底部會帶一枚不可見的 AI 水印。
aiAgent.provider=AI 廠商
aiAgent.maxStepsHint=一次對話最多 {0} 輪工具調用（可在 LocalSettings.yaml 的 wikikernel.ai.max-steps 調整；0 \= 不限制）
aiAgent.welcome=告訴代理你想做什麼（可以讓它讀詞條、起草或修改）。它只會「起草」：你可以在「Wikitext」裏直接改，確認後才以你的名義保存。
aiAgent.inputPlaceholder=例如：幫我閱讀「首頁」和「幫助\:編輯」，把首頁導語改得更簡潔（輸出完整正文）。
