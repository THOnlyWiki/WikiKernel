aiAgent.howtoRead=代理可以 read 詞條、search 搜索、list 列舉頁面（含模板 / 模塊命名空間）、info 查看模板、分類與鏈入、history 查看歷史。
aiAgent.howtoConfirm=代理只能 propose（生成提案）：你可以直接修改正文，點「確認提交」後以你的名義直接保存（AI 內容由你負責核對，不走審核隊列）。
aiAgent.howtoWatermark=AI 協助的版本帶一枚隱藏水印：詞條最底部的不可見元素（不佔位、不影響閱讀），數據可在 HTML 源碼裏查看。
aiAgent.howtoConcurrency=代理讀取頁面後會記住版本號：期間若有他人提交，確認時會被拒絕並提示重新生成，避免覆蓋別人的改動。
aiAgent.howtoConfig=廠商密鑰在網頁上填：參數設置 → AI 代理（我的密鑰）；站點共用密鑰由管理員在 特殊\:AI代理?keys\=1 裏填。也可以寫在 LocalSettings.yaml 的 wikikernel.ai.providers 裏。
