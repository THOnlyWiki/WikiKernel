# ==================== Built-in vendor names and hints (AiVendorCatalog labelKey / hintKey) ====================
# Vendor names and hints live only here and in messages.properties: the Java code holds message keys,
# and a missing key falls back to the vendor id (a data identifier), never to Chinese text.
# The demo vendor (type=mock, id stays "mock") is called "Demo (canned replies)"; its hint must make clear
# that it is not a real AI.
aiAgent.vendor.mock.label=Demo (canned replies)
aiAgent.vendor.mock.hint=Offline demo vendor\: replies are fixed canned examples, not a real AI. It needs no API key and spends no quota — please do not treat it as a free API. For real conversations, add your own key under Special\:Preferences → AI agent (or ask an admin to configure a site key in Special\:AIAgent?keys\=1).
aiAgent.vendor.openai.label=OpenAI
aiAgent.vendor.openai.hint=Get an API key at platform.openai.com
aiAgent.vendor.deepseek.label=DeepSeek
aiAgent.vendor.deepseek.hint=Get an API key at platform.deepseek.com (reachable directly from mainland China, inexpensive)
aiAgent.vendor.groq.label=Groq
aiAgent.vendor.groq.hint=Get an API key at console.groq.com (generous free tier, very fast; may need a proxy on this machine)
aiAgent.vendor.gemini.label=Google Gemini
aiAgent.vendor.gemini.hint=Get an API key at aistudio.google.com (free tier available; a proxy is usually needed on this machine)
aiAgent.vendor.anthropic.label=Anthropic Claude
aiAgent.vendor.anthropic.hint=Get an API key at console.anthropic.com (a proxy is usually needed on this machine)
aiAgent.vendor.openrouter.label=OpenRouter
aiAgent.vendor.openrouter.hint=One key from openrouter.ai covers many models, free ones included (reachable directly from here)
aiAgent.vendor.siliconflow.label=硅基流动 (SiliconFlow)
aiAgent.vendor.siliconflow.hint=Get an API key at siliconflow.cn (reachable directly from mainland China)
aiAgent.vendor.ollama.label=Ollama (local models)
aiAgent.vendor.ollama.hint=No API key and fully offline once Ollama runs on this machine (your data never leaves it)
aiAgent.vendor.custom.label=Custom (OpenAI-compatible)
aiAgent.vendor.custom.hint=Any OpenAI-compatible endpoint\: set the base URL (including /v1), the model name and a key
# Shown (and used by the front-end script) while the demo vendor is selected: the prompt box is locked
aiAgent.demoLockNotice=Demo (canned replies)\: replies are fixed canned examples, not a real AI. No key is needed and no quota is spent, so the prompt box is locked. For real conversations, add your own key under Special\:Preferences → AI agent, or ask an admin to configure a site key in Special\:AIAgent?keys\=1.
aiAgent.demoLockPlaceholder=Demo mode\: input is locked and replies are canned examples
