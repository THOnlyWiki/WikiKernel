# AI agent (plugin ai-agent) - English
plugin.ai-agent.name=AI agent (AiAgent)
# 别名（Java 包名同形）；core 的 PluginI18n 用的是上面那个带连字符的 plugin.id
plugin.ai-agent.description=Multi-vendor chat, read-only wiki tools and edit proposals you confirm before saving
# 别名（同上）

special.aiAgent=AI agent
aiAgent.disabledHint=The AI agent is disabled\: turn it on in the /init wizard or at Special\:AccessControl → Site settings (features.ai-agent).
aiAgent.loginRequired=You need to log in to use the AI agent.
aiAgent.notAllowedHint=You are not allowed to use the AI agent\: you need the "{0}" group, or an administrator must allow normal users (Special\:AiAgent?keys\=1 → "Allow normal users", i.e. ai-agent.allow-normal-users).
aiAgent.noProviderHint=No AI provider is available yet\: the built-in "Demo (canned replies)" provider always works (its replies are fixed examples, not a real AI, and it needs no key); to use a real model, add your own key in Preferences → AI agent (or ask an administrator for a site key at Special\:AiAgent?keys\=1).
aiAgent.intro=The AI agent can read pages and templates and draft or change content on your request. Nothing is saved until you check the preview and diff and confirm; saving is done in your own name, bypasses the review queue, and adds an invisible AI watermark to the page.
