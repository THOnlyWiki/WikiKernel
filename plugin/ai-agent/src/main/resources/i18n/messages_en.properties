aiAgent.maxStepsHint=At most {0} tool rounds per conversation (adjust wikikernel.ai.max-steps in LocalSettings.yaml; 0 \= unlimited)
aiAgent.welcome=Tell the agent what you want (it can read pages and draft changes). It only drafts\: you can edit the wikitext directly and nothing is saved under your name until you confirm.
aiAgent.inputPlaceholder=e.g. Read "首页" and "帮助\:编辑" and make the lead of the main page more concise (return the full wikitext).
