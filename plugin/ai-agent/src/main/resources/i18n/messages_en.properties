aiAgent.howtoTitle=How it works
aiAgent.howtoRead=Tools\: read a page, search the wiki, list pages (including template/module namespaces), info (templates, categories, backlinks), history.
aiAgent.howtoConfirm=The agent can only propose\: you may edit the text, and after you press Confirm it is saved directly in your name (you own the content; the review queue is not used).
aiAgent.howtoWatermark=AI-assisted revisions carry an invisible watermark\: a hidden element at the very bottom of the page (no layout, no effect on reading); the data is visible in the HTML source.
aiAgent.howtoConcurrency=The agent remembers the revision it read\: if someone else edits the page meanwhile, your confirmation is rejected and you are asked to regenerate, so other people's changes are never overwritten.
aiAgent.howtoConfig=Provider keys are configured on the web\: Preferences → AI agent (my key); site-wide keys are set by an administrator at Special\:AiAgent?keys\=1. They can also live in LocalSettings.yaml under wikikernel.ai.providers.
