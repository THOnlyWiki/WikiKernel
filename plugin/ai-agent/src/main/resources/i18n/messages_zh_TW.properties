# WikiKernel interface messages

plugin.ai-agent.name=AI 代理
plugin.ai-agent.description=多廠商對話 + 只讀工具 + 待確認提案（特殊\:AI代理 + /api/ai-agent/* + /api/ai-keys/*）
special.aiAgent=AI 代理
aiAgent.disabledHint=AI 代理功能未啟用：可在 /init 安裝嚮導或 特殊\:許可權配置 → 站點設定 裡開啟（features.ai-agent）。
aiAgent.loginRequired=AI 代理需要登入後使用。
aiAgent.notAllowedHint=你沒有使用 AI 代理的許可權：需要「{0}」使用者組，或由管理員放開普通使用者（特殊\:AI代理?keys\=1 → 「允許普通使用者使用」，即 ai-agent.allow-normal-users）。
aiAgent.noProviderHint=還沒有可用的 AI 廠商：內建的「演示模式（固定回覆）」隨時可用（回覆是預先寫好的固定示例，不是真實 AI，不需要金鑰）；要接入真實模型，請在 引數設定 → AI 代理 填自己的金鑰（或讓管理員在 特殊\:AI代理?keys\=1 裡填站點金鑰）。
aiAgent.intro=AI 代理可以閱讀詞條與模板、按你的要求起草或修改內容；任何編輯都要你核對預覽與差異後確認才會儲存，儲存以你的名義進行、不經稽核佇列，詞條底部會帶一枚不可見的 AI 水印。
aiAgent.provider=AI 廠商
aiAgent.maxStepsHint=一次對話最多 {0} 輪工具呼叫（可在 LocalSettings.yaml 的 wikikernel.ai.max-steps 調整；0 \= 不限制）
aiAgent.welcome=告訴代理你想做什麼（可以讓它讀詞條、起草或修改）。它只會「起草」：你可以在「Wikitext」裡直接改，確認後才以你的名義儲存。
aiAgent.inputPlaceholder=例如：幫我閱讀「首頁」和「幫助\:編輯」，把首頁導語改得更簡潔（輸出完整正文）。
aiAgent.send=傳送
