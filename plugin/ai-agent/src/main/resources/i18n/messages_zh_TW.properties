aiAgent.howtoRead=代理可以 read 詞條、search 搜尋、list 列舉頁面（含模板 / 模組名稱空間）、info 檢視模板、分類與鏈入、history 檢視歷史。
aiAgent.howtoConfirm=代理只能 propose（生成提案）：你可以直接修改正文，點「確認提交」後以你的名義直接儲存（AI 內容由你負責核對，不走稽核佇列）。
aiAgent.howtoWatermark=AI 協助的版本帶一枚隱藏水印：詞條最底部的不可見元素（不佔位、不影響閱讀），資料可在 HTML 原始碼裡檢視。
aiAgent.howtoConcurrency=代理讀取頁面後會記住版本號：期間若有他人提交，確認時會被拒絕並提示重新生成，避免覆蓋別人的改動。
aiAgent.howtoConfig=廠商金鑰在網頁上填：引數設定 → AI 代理（我的金鑰）；站點共用金鑰由管理員在 特殊\:AI代理?keys\=1 裡填。也可以寫在 LocalSettings.yaml 的 wikikernel.ai.providers 裡。
