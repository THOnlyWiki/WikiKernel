# AI 代理（插件 ai-agent）—— 默认语言（中文）
# 键名与迁移前 core 的 messages.properties 一致；漏翻的键由 core 回退成翻译键本身
plugin.ai-agent.name=AI 代理
# 别名（Java 包名同形）；core 的 PluginI18n 用的是上面那个带连字符的 plugin.id
plugin.ai-agent.description=多厂商对话 + 只读工具 + 待确认提案（特殊\:AI代理 + /api/ai-agent/* + /api/ai-keys/*）
# 别名（同上）

special.aiAgent=AI 代理
aiAgent.disabledHint=AI 代理功能未启用：可在 /init 安装向导或 特殊\:权限配置 → 站点设置 里打开（features.ai-agent）。
aiAgent.loginRequired=AI 代理需要登录后使用。
aiAgent.notAllowedHint=你没有使用 AI 代理的权限：需要「{0}」用户组，或由管理员放开普通用户（特殊\:AI代理?keys\=1 → 「允许普通用户使用」，即 ai-agent.allow-normal-users）。
aiAgent.noProviderHint=还没有可用的 AI 厂商：内置的「演示模式（固定回复）」随时可用（回复是预先写好的固定示例，不是真实 AI，不需要密钥）；要接入真实模型，请在 参数设置 → AI 代理 填自己的密钥（或让管理员在 特殊\:AI代理?keys\=1 里填站点密钥）。
aiAgent.intro=AI 代理可以阅读词条与模板、按你的要求起草或修改内容；任何编辑都要你核对预览与差异后确认才会保存，保存以你的名义进行、不经审核队列，词条底部会带一枚不可见的 AI 水印。
aiAgent.provider=AI 厂商
aiAgent.maxStepsHint=一次对话最多 {0} 轮工具调用（可在 LocalSettings.yaml 的 wikikernel.ai.max-steps 调整；0 \= 不限制）
