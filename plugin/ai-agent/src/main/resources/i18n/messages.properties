aiAgent.howtoRead=代理可以 read 词条、search 搜索、list 列举页面（含模板 / 模块命名空间）、info 查看模板、分类与链入、history 查看历史。
aiAgent.howtoConfirm=代理只能 propose（生成提案）：你可以直接修改正文，点「确认提交」后以你的名义直接保存（AI 内容由你负责核对，不走审核队列）。
aiAgent.howtoWatermark=AI 协助的版本带一枚隐藏水印：词条最底部的不可见元素（不占位、不影响阅读），数据可在 HTML 源码里查看。
aiAgent.howtoConcurrency=代理读取页面后会记住版本号：期间若有他人提交，确认时会被拒绝并提示重新生成，避免覆盖别人的改动。
aiAgent.howtoConfig=厂商密钥在网页上填：参数设置 → AI 代理（我的密钥）；站点共用密钥由管理员在 特殊\:AI代理?keys\=1 里填。也可以写在 LocalSettings.yaml 的 wikikernel.ai.providers 里。
