# 插件依赖演示（platform capability demo）
# 键与语义见根目录 README 的「插件加载原理（core 侧）」一节：
#   plugin.requires       运行期依赖的其它插件 id（逗号分隔）：被依赖者先启动；缺失 / 被禁用 / 启动失败时本插件跳过启动
#   plugin.requiresCore   core 版本约束：>=、>、<=、<、= 或裸版本号；不满足时本插件跳过启动
#   plugin.clientRequires 客户端（前端资源）依赖的其它插件 id：只影响 <head> 注入顺序；缺失时页面留 HTML 注释 + WARN
plugin.id=dep-demo
plugin.name=${pluginName}
plugin.version=${pluginVersion}
plugin.description=${pluginDescription}
plugin.mainClass=cc.thonly.wikikernel.plugin.depdemo.DepDemoPlugin
# 本插件不依赖任何其它插件的后端能力（留空即无依赖；要演示依赖可以写成 plugin.requires=comments）
plugin.requires=
# core 版本约束：数字段比较，0.0.1-SNAPSHOT 也满足（限定符不参与比较）
plugin.requiresCore=>=0.0.1
# 前端资源依赖：本插件的 head 片段要求 comments 插件的脚本先加载（comments 没装时页面留注释 + WARN，插件照常启动）
plugin.clientRequires=comments
# 声明本插件要用 CoreAopHook 对 core 的 Bean 加切面：
# 默认（wikikernel.plugins.aop-bridge=auto）只有声明了这一项的插件存在时，core 才会启用插件 AOP 桥
plugin.aop=true
