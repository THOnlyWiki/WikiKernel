# 注册问答验证（插件 registration-quiz）—— 默认语言（中文）
# 键名与迁移前 core 的 messages.properties 保持一致；漏翻的键会直接显示键名
plugin.registration-quiz.name=注册问答验证（Registration Quiz）
plugin.registration-quiz.description=注册问答验证：两个等长数组（registration.questions / registration.answers）随机抽题、按下标校验

# 注册页的问答提示与答错提示
auth.registerAnswerHint=请回答上面的注册问题（每次注册随机抽取一题），答对才能完成注册。
auth.registerAnswerWrong=注册问答答案不正确，请重试。

# ---- settings section / setup wizard (plugin-owned; same keys as before migration) ----
settings.registerQuizHint=注册页每次从下面随机抽一题（问题数组 a 与答案数组 b 必须数量相等、一一对应），答对该题答案才能注册；答案不区分大小写、忽略首尾空白。
setup.registrationQuizHint=问题数组 a 与答案数组 b 必须数量相等（一一对应）；注册页每次随机抽一题，答对才能注册。
settings.registerQuiz=启用注册问答验证
setup.registrationQuiz=启用注册问答验证
settings.registerQuizEnabled=启用注册问答验证
settings.registerQuizQuestions=问题列表（每行一题，与答案按下标一一对应）
settings.registerQuizAnswers=答案列表（每行一题，数量与问题相同）

setup.registerQuizSaved=注册问答设置已写入 LocalSettings.yaml（重启后生效）
