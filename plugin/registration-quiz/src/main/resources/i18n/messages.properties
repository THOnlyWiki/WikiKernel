# 注册问答验证（插件 registration-quiz）—— 默认语言（中文）
# 键名与迁移前 core 的 messages.properties 保持一致；漏翻的键会直接显示键名
plugin.registration-quiz.name=注册问答验证（Registration Quiz）
plugin.registration-quiz.description=注册问答验证：每行一题「问题 | 答案1 | 答案2」，同一题支持多个答案，随机抽题校验

# 注册页的问答提示与答错提示
auth.registerAnswerHint=请回答上面的注册问题（每次注册随机抽取一题），答对才能完成注册。
auth.registerAnswerWrong=注册问答答案不正确，请重试。

# ---- settings section / setup wizard (plugin-owned; same keys as before migration) ----
settings.registerQuizHint=一行一题，格式为「问题 | 答案1 | 答案2」；同一题可以有多个可接受答案，注册页随机抽一题，答对任意一个即可。答案不区分大小写、忽略首尾空白；旧的「问题列表 / 答案列表」配置仍兼容。
setup.registrationQuizHint=一行一题，格式为「问题 | 答案1 | 答案2」；同一题可以填写多个可接受答案，注册页随机抽一题，答对任意一个即可。
settings.registerQuiz=启用注册问答验证
setup.registrationQuiz=启用注册问答验证
settings.registerQuizEnabled=启用注册问答验证
settings.registerQuizItems=问答列表（一行一题：问题 | 答案1 | 答案2 …）
auth.registerQuizInvalid=注册问答格式不正确：每行至少需要「问题 | 答案」。
settings.registerQuizQuestions=问题列表（旧格式，每行一题；新配置请使用上面的问答列表）
settings.registerQuizAnswers=答案列表（旧格式，每行一题；新配置请使用上面的问答列表）

setup.registerQuizSaved=注册问答设置已写入 LocalSettings.yaml（重启后生效）
