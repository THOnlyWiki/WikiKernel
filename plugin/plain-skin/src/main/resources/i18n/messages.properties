# Plain 皮肤插件（插件 plain-skin）—— 默认语言（中文）
# 键名与 core 的约定一致（plugin.<id>.* / skin.<id>.*）；漏翻的键会直接显示键名
plugin.plain-skin.name=Plain 皮肤插件（PlainSkin）
plugin.plain-skin.description=Plain 皮肤插件：提供精简的 plain 皮肤，布局与样式都在插件 jar 内

skin.plain.name=Plain 皮肤
skin.plain.description=精简皮肤（由插件提供）：居中卡片、无侧栏，layout 与 CSS 都来自插件 jar

setup.plain-skin.description=注册 plain 皮肤（布局与样式都在插件 jar 内）。
setup.plain-skin.default=将 plain 皮肤设为站点默认皮肤
setup.plain-skin.savedDefault=已写入：默认皮肤 \= plain
setup.plain-skin.savedKept=已保存（保持默认皮肤）
