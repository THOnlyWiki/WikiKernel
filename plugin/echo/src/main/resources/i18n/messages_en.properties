# Echo plugin (MediaWiki Echo style notifications)
plugin.echo.name=Echo notifications
plugin.echo.description=Notification center for talk page edits, mentions, rollbacks and new-user welcome (header bell + Special:Notifications)

# Common
echo.title=Notifications
echo.alerts.title=Alerts
echo.notices.title=Notices
echo.viewAll=View all notifications
echo.empty=No notifications yet.
echo.notFound=The notification does not exist or was deleted.
echo.markRead=Mark as read
echo.markedRead=Marked as read
echo.markAllRead=Mark all as read
echo.markedAllRead=All notifications marked as read
echo.unreadCount={0} unread
echo.jumpTo=View
echo.networkError=Network error, please try again later
echo.operationFailed=Operation failed, please try again later
echo.loginRequired=Please log in to view your notifications.
echo.actor.system=System

# Page
echo.page.desc=Notifications you received (talk page edits / mentions / rollbacks / welcome).
echo.filter.label=Filter by type
echo.filter.all=All
echo.pager.prev=Newer
echo.pager.next=Older
echo.pager.info={0}-{1} of {2}

# Types
echo.type.edit-user-talk=Talk page
echo.type.mention=Mention
echo.type.revert=Revert
echo.type.welcome=Welcome

# Descriptions (server-built html: actor / page links live outside, these are static texts)
echo.desc.editUserTalk=edited your user talk page.
echo.desc.mention.before=mentioned you on
echo.desc.mention.after=.
echo.desc.revert.before=rolled back your edit on
echo.desc.revert.after=.
echo.desc.welcome=Welcome to this wiki! Happy editing.
echo.desc.generic=sent you a notification.

# Preferences (notification section)
echo.preferences.title=Notifications
echo.preferences.hint=Choose which notifications you want to receive (disabled ones never show up in the bell or Special:Notifications).
echo.preferences.save=Save notification settings
echo.preferences.saved=Notification settings saved
echo.preferences.disabled=Notifications are disabled on this site.
echo.preferences.edit-user-talk=Someone edits my user talk page
echo.preferences.mention=Someone mentions me or links to my user page
echo.preferences.revert=My edits are rolled back
echo.preferences.welcome=New user welcome notification
echo.preferences.email=Send these notifications by email (requires a confirmed email address)
echo.preferences.emailDisabled=Email sending is not available on this site (or the Echo email type is disabled), so notification emails cannot be sent yet.

# Email notifications (mail type echo-notification)
email.typeName.echo-notification=Notifications
echo.email.subject=You have new wiki notifications
echo.email.footer=You received this email because you enabled notification emails in Special:Preferences → Notifications; you can turn it off there at any time.

# Site settings section
echo.settings.title=Echo notifications
echo.settings.description=Notifications plugin (MediaWiki Echo style): site-wide switches for talk page / mention / revert notifications.
echo.settings.enabled=Enable Echo notifications
echo.settings.disableMention=Disable mention notifications
echo.settings.disableTalk=Disable user talk page edit notifications
echo.settings.disableRevert=Disable rollback notifications
echo.settings.disableWelcome=Disable new user welcome notifications

# Feature switch
feature.echo.name=Echo notifications
feature.echo.description=Notification center for talk page edits, mentions, rollbacks and welcomes (header bell + Special:Notifications).
feature.echoDisabled=Notifications are disabled on this site.