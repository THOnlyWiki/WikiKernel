plugin.id=echo
plugin.name=${pluginName}
plugin.version=${pluginVersion}
plugin.description=${pluginDescription}
plugin.mainClass=cc.thonly.wikikernel.plugin.echo.EchoPlugin

# 通知触发需要切 core 的 WikiPageService / ActionApiService Bean（见 CoreAopHook）
plugin.aop=true

# Feature switch (rendered by core in Settings -> Plugin settings and in the setup wizard)
plugin.featureKey=features.echo
plugin.featureDefault=true