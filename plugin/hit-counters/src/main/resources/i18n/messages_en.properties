# Page view counters (plugin hit-counters) - English
plugin.hit-counters.name=Page view counters (HitCounters)
plugin.hit-counters.description=Page view counting with the {{NUMBEROFVIEWS}} magic word, Special\:PopularPages and a footer counter

# Plugin settings in the setup wizard (/init)
setup.hit-counters.description=Page view counting\: the {{NUMBEROFVIEWS}} magic word, Special\:PopularPages and the footer counter.
setup.hit-counters.disabled=Disable view counting
setup.hit-counters.footer=Show "this page has been viewed N times" in the footer
setup.hit-counters.enable-add-page-id=List the page ID on Special\:PopularPages
setup.hit-counters.enable-add-text-length=List the byte size on Special\:PopularPages
setup.hit-counters.exempt-groups=Groups exempt from counting (comma-separated; bots are never counted)
setup.hit-counters.saved=HitCounters settings saved (they take effect after a restart)

# Footer view count (appended to the article body)
hitcounters.footer=This page has been viewed {0} times.

# Special:PopularPages
hitcounters.special.title=Popular pages
hitcounters.intro=Pages ranked by view count (like MediaWiki's Special\:PopularPages).
hitcounters.disabled=View counting is turned off in the plugin settings (hit-counters.disabled \= true).
hitcounters.table.page=Page
hitcounters.table.views=Views
hitcounters.table.length=Bytes
hitcounters.table.pageId=Page ID
hitcounters.empty=No page views recorded yet.
hitcounters.total=Total views across the wiki\:
