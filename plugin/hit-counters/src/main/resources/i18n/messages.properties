# 页面浏览计数（插件 hit-counters）—— 默认语言（中文）
# 漏翻的键会直接显示键名
plugin.hit-counters.name=页面浏览计数（HitCounters）
plugin.hit-counters.description=移植自 MediaWiki HitCounters：页面浏览计数与「特殊\:最多浏览」

# 安装向导（/init）里的插件设置
setup.hit-counters.description=页面浏览计数\:{{NUMBEROFVIEWS}} 魔术字、「特殊\:最多浏览」与页脚计数。
setup.hit-counters.disabled=关闭浏览计数
setup.hit-counters.footer=页脚显示「本页面已被访问 N 次」
setup.hit-counters.enable-add-page-id=「最多浏览」显示页面 ID
setup.hit-counters.enable-add-text-length=「最多浏览」显示字节数
setup.hit-counters.exempt-groups=豁免计数的用户组（逗号分隔；机器人始终不计数）
setup.hit-counters.saved=已保存 HitCounters 设置（重启后生效）

# 页脚浏览量（追加在正文末尾）
hitcounters.footer=本页面已被访问 {0} 次。

# 特殊:最多浏览
hitcounters.special.title=最多浏览
hitcounters.intro=按浏览量排序的页面（仿 MediaWiki 的 特殊\:最多浏览 / Special\:PopularPages）。
hitcounters.disabled=浏览计数已在插件设置里关闭（hit-counters.disabled \= true）。
hitcounters.table.page=页面
hitcounters.table.views=浏览量
hitcounters.table.length=字节数
hitcounters.table.pageId=页面 ID
hitcounters.empty=还没有浏览记录。
hitcounters.total=全站总浏览量：
