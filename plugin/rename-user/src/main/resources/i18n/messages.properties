# 重命名用户（插件 rename-user）—— 默认语言（中文）
# 键名与迁移前 core 的 messages.properties 一致；漏翻的键由 core 回退成翻译键本身
plugin.rename-user.name=重命名用户
plugin.rename-user.description=把用户账号改名（特殊\:重命名用户 + /api/user/rename）

special.renameUser=重命名用户
renameUser.summary=将某个用户的账号名改为新名字（仿 MediaWiki 的 Renameuser 扩展；需要「重命名用户」权限）。用户页与用户讨论页会一并改名（含子页面）。
renameUser.oldName=原用户名
renameUser.newName=新用户名
renameUser.reason=原因（可选）
renameUser.movePages=同时重命名用户页 / 用户讨论页（含子页面）
renameUser.submit=重命名用户
renameUser.noPermission=需要「重命名用户」权限。
renameUser.notFound=用户「{0}」不存在。
renameUser.taken=用户名「{0}」已被占用。
renameUser.invalid=用户名无效（不能为空，且不能包含 # < > [ ] | { } / 等字符）。
renameUser.same=新旧用户名相同。
renameUser.confirm=确定要将用户「{0}」重命名为「{1}」吗？
renameUser.success=已将用户「{0}」重命名为「{1}」。
renameUser.recent=最近的重命名
renameUser.movedPages=同时移动了 {0} 个用户页 / 子页面。
log.typeName.renameuser=用户重命名
log.entry.renameuser=重命名用户 {0}
log.renameuser.newName=新用户名：{0}
log.renameuser.reason=，原因：{0}
