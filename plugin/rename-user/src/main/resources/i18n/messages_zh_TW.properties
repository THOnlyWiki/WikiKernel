# WikiKernel interface messages

plugin.rename-user.name=重新命名使用者
plugin.rename-user.description=把使用者賬號改名（特殊\:重新命名使用者 + /api/user/rename）
special.renameUser=重新命名使用者
renameUser.summary=將某個使用者的賬號名改為新名字（仿 MediaWiki 的 Renameuser 擴充套件；需要「重新命名使用者」許可權）。使用者頁與使用者討論頁會一併改名（含子頁面）。
renameUser.oldName=原使用者名稱
