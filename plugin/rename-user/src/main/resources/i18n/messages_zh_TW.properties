renameUser.reason=原因（可選）
renameUser.movePages=同時重新命名使用者頁 / 使用者討論頁（含子頁面）
renameUser.submit=重新命名使用者
renameUser.noPermission=需要「重新命名使用者」許可權。
renameUser.notFound=使用者「{0}」不存在。
renameUser.taken=使用者名稱「{0}」已被佔用。
renameUser.invalid=使用者名稱無效（不能為空，且不能包含 # < > [ ] | { } / 等字元）。
renameUser.same=新舊使用者名稱相同。
renameUser.confirm=確定要將使用者「{0}」重新命名為「{1}」嗎？
renameUser.success=已將使用者「{0}」重新命名為「{1}」。
renameUser.recent=最近的重新命名
renameUser.movedPages=同時移動了 {0} 個使用者頁 / 子頁面。
