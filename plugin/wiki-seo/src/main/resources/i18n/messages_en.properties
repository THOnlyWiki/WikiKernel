# Page-level SEO metadata (plugin wiki-seo) - English
plugin.wiki-seo.name=WikiSEO page metadata
plugin.wiki-seo.description=Page-level SEO metadata for MediaWiki WikiSEO 2.7.0\: {{#seo}} / <seo>, meta / OpenGraph / Twitter / Schema.org / Citation / Dublin Core and title rewriting

# Plugin settings in the setup wizard (/init)
setup.wiki-seo.description=Page-level SEO metadata\: the {{#seo:...}} / <seo> entry points, the meta / OpenGraph / Twitter / Schema.org / Citation / Dublin Core generators and <title> rewriting.
setup.wiki-seo.metadata-generators=Metadata generators (comma-separated\: OpenGraph,Twitter,SchemaOrg,Citation,DublinCore; default OpenGraph,Twitter,SchemaOrg)
setup.wiki-seo.twitter-site-handle=Global twitter\:site (e.g. @YourSite; when set, page parameters are ignored)
setup.wiki-seo.twitter-card-type=twitter\:card type (default summary_large_image)
setup.wiki-seo.default-image=Default image (local file name or URL; used when the page has no image parameter)
setup.wiki-seo.disable-logo-fallback-image=Disable the site logo fallback image (no image is emitted without an image or default image)
setup.wiki-seo.default-language=Default language (e.g. zh-cn; emits one hreflang alternate for the current page)
setup.wiki-seo.noindex-page-titles=Page titles that should be noindex (comma-separated)
setup.wiki-seo.enable-auto-description=Enable the automatic description (generated from the page text when there is no manual description; replaces TextExtracts)
setup.wiki-seo.try-clean-auto-description=Trim the automatic description at the last full stop
setup.wiki-seo.google-site-verification-key=Google Search Console verification code
setup.wiki-seo.bing-site-verification-key=Bing Webmaster verification code (msvalidate.01)
setup.wiki-seo.facebook-app-id=Facebook Insights app ID (fb\:app_id)
setup.wiki-seo.facebook-admins=Facebook Insights admin IDs (comma-separated, fb\:admins)
setup.wiki-seo.yandex-site-verification-key=Yandex Webmasters verification code
setup.wiki-seo.pinterest-site-verification-key=Pinterest verification code (p\:domain_verify)
setup.wiki-seo.norton-site-verification-key=Norton Safe Web verification code
setup.wiki-seo.naver-site-verification-key=Naver verification code
setup.wiki-seo.baidu-site-verification-key=Baidu verification code
setup.wiki-seo.overwrite-page-image=Mirrors $wgWikiSeoOverwritePageImage\: WikiKernel has no PageImages, so it is kept but inactive
setup.wiki-seo.saved=WikiSEO settings saved (they take effect after a restart)
