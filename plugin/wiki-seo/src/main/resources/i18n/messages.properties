# 页面级 SEO 元数据（插件 wiki-seo）—— 默认语言（中文）
# 漏翻的键会直接显示键名
plugin.wiki-seo.name=WikiSEO 页面元数据
plugin.wiki-seo.description=移植自 MediaWiki WikiSEO 2.7.0\：页面级 SEO 元数据（{{#seo}} / <seo>、meta / OpenGraph / Twitter / Schema.org / Citation / Dublin Core、标题改写）

# 安装向导（/init）里的插件设置
setup.wiki-seo.description=页面级 SEO 元数据\：{{#seo:…}} / <seo> 标签、meta / OpenGraph / Twitter / Schema.org / Citation / Dublin Core 生成器与 <title> 改写。
setup.wiki-seo.metadata-generators=元数据生成器（逗号分隔\：OpenGraph,Twitter,SchemaOrg,Citation,DublinCore；默认 OpenGraph,Twitter,SchemaOrg）
setup.wiki-seo.twitter-site-handle=全局 twitter\:site（如 @YourSite；设置后页面参数被忽略）
setup.wiki-seo.twitter-card-type=twitter\:card 类型（默认 summary_large_image）
setup.wiki-seo.default-image=默认图片（本地文件名或 URL；页面没有 image 参数时使用）
setup.wiki-seo.disable-logo-fallback-image=关闭「站点 Logo 兜底图片」（没有 image 与默认图片时不输出图片）
setup.wiki-seo.default-language=默认语言（如 zh-cn，给当前页输出一条 hreflang alternate）
setup.wiki-seo.noindex-page-titles=需要 noindex 的页面标题（逗号分隔）
setup.wiki-seo.enable-auto-description=开启自动描述（页面没有手工 description 时用正文生成，替代 TextExtracts）
setup.wiki-seo.try-clean-auto-description=自动描述截到最后一个句号
setup.wiki-seo.google-site-verification-key=Google Search Console 验证码
setup.wiki-seo.bing-site-verification-key=Bing 网站管理员验证码（msvalidate.01）
setup.wiki-seo.facebook-app-id=Facebook Insights App ID（fb\:app_id）
setup.wiki-seo.facebook-admins=Facebook Insights 管理员 ID（逗号分隔，fb\:admins）
setup.wiki-seo.yandex-site-verification-key=Yandex Webmasters 验证码
setup.wiki-seo.pinterest-site-verification-key=Pinterest 验证码（p\:domain_verify）
setup.wiki-seo.norton-site-verification-key=Norton Safe Web 验证码
setup.wiki-seo.naver-site-verification-key=Naver 验证码
setup.wiki-seo.baidu-site-verification-key=百度验证码
setup.wiki-seo.overwrite-page-image=对应 $wgWikiSeoOverwritePageImage\：WikiKernel 没有 PageImages，保留但不生效
setup.wiki-seo.saved=已保存 WikiSEO 设置（重启后生效）
