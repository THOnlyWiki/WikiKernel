# 微件（插件 widget）—— 默认语言（中文）
# 键名与迁移前 core / Java 消息表保持一致；漏翻的键会直接显示键名
plugin.widget.name=微件（Widgets）
plugin.widget.description=移植自 MediaWiki Widgets：{{#widget\:名称|参数\=值}} 调用「微件\:」命名空间页面（HTML + 迷你 Smarty）

# 渲染错误提示（{{#widget:…}} 的输出）
widget.error.noname=错误\:未指定微件名称
widget.error.disabled=错误\:微件功能未启用（可在 /init 或 特殊\:权限配置 → 站点设置 中开启）
widget.error.notfound=错误\:找不到微件「{0}」
widget.error.render=错误\:微件「{0}」渲染失败
