# Browser fingerprint login (plugin fingerprint-login) - English
# Missing keys show the key itself (the core message source never falls back to Chinese)
plugin.fingerprint-login.name=Browser fingerprint login
plugin.fingerprint-login.description=Passwordless sign-in with a browser fingerprint: register several browsers per account, sign in with one click, manage them in Preferences / Special:Fingerprint login

