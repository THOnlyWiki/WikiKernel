# 浏览器数字指纹登录（插件 fingerprint-login）—— 默认语言（中文）
# 漏翻的键会直接显示键名（core 的消息源不回落到中文）
plugin.fingerprint-login.name=浏览器指纹登录
plugin.fingerprint-login.description=用浏览器指纹免密码登录：一个账号可登记多个浏览器指纹，登录页一键登录，参数设置 / 特殊:指纹登录 里自助管理

# ==================== 登录页（注入脚本用） ====================
fingerprint.login.button=用浏览器指纹登录
fingerprint.login.buttonHint=在这台设备上直接登录（不需要输入密码）
fingerprint.login.working=正在计算浏览器指纹…
fingerprint.login.notSupported=当前浏览器环境不支持指纹登录：需要安全上下文（HTTPS 或 localhost）且浏览器支持 Web Crypto。
fingerprint.login.remember=登录后保持登录状态（与密码登录的「记住我的登录状态」相同）
fingerprint.login.success=已用浏览器指纹登录，正在跳转…
fingerprint.login.error=浏览器指纹登录失败，请改用密码登录。
fingerprint.login.networkError=网络错误，请稍后重试。

# ==================== 管理界面（参数设置分区 + 特殊:指纹登录） ====================
fingerprint.page.title=指纹登录
fingerprint.special.intro=在这里管理自己的浏览器指纹：登记过的浏览器可以免密码登录。本页只列出你自己的指纹，管理员也看不到别人的。
fingerprint.special.loginRequired=请先登录后再管理浏览器指纹。
fingerprint.special.loginLink=请先登录
fingerprint.special.openPreferences=打开参数设置
fingerprint.preferences.title=指纹登录
fingerprint.preferences.intro=用浏览器指纹免密码登录：登记过的浏览器可以一键登录。指纹只从浏览器采集，服务端不保存原始特征。
fingerprint.preferences.manage=管理我的指纹
fingerprint.disabled=浏览器指纹登录当前未启用（features.fingerprint-login；需要在站点设置里开启）。
fingerprint.httpsOnly=本项设置要求 HTTPS：当前站点不是安全上下文，指纹登录已被禁用。
fingerprint.httpsOnlyHint=「仅 HTTPS 允许」已开启：非 HTTPS 访问（http + 非 localhost）无法使用指纹登录。
fingerprint.maxReached=每用户的指纹数量已达上限（{0} 个），请先删除不再使用的指纹。
fingerprint.list.empty=还没有登记任何浏览器指纹。
fingerprint.list.label=名称
fingerprint.list.createdAt=创建时间
fingerprint.list.lastUsedAt=最近使用
fingerprint.list.userAgent=浏览器
fingerprint.list.never=从未使用
fingerprint.list.remove=删除
fingerprint.list.removeConfirm=确定删除「{0}」这个指纹吗？删除后这台浏览器将不能再用它登录。
fingerprint.add.title=添加当前浏览器
fingerprint.add.label=名称（便于自己辨认，如「我的笔记本 Chrome」）
fingerprint.add.labelPlaceholder=我的笔记本 Chrome
fingerprint.add.submit=添加当前浏览器指纹
fingerprint.add.hint=名称只对你可见；同名浏览器重复添加会更新名称与浏览器信息。
fingerprint.add.success=已添加浏览器指纹「{0}」。
fingerprint.add.updated=这台浏览器已经登记过，已更新名称与浏览器信息。
fingerprint.remove.success=已删除浏览器指纹。
fingerprint.error.hashRequired=缺少浏览器指纹数据。
fingerprint.error.hashInvalid=浏览器指纹数据格式不正确。
fingerprint.error.labelRequired=请填写名称。
fingerprint.error.labelTooLong=名称过长（最多 {0} 个字符）。
fingerprint.error.notFound=指纹不存在，或不属于当前用户。
fingerprint.error.forbidden=这个指纹已经登记在其它账号下。
fingerprint.error.loginRequired=请先登录。
fingerprint.error.disabled=浏览器指纹登录当前未启用。
fingerprint.error.badCredentials=浏览器指纹登录失败，请改用密码登录。
fingerprint.error.rateLimited=尝试过于频繁，请等待 {0} 秒后重试。
fingerprint.error.saveFailed=保存失败，请稍后重试。
