# 插件名（技术名，不随语言变化；给人看的中文 / 英文名见 i18n/messages*.properties 的 plugin.easy-timeline.name）
pluginName=EasyTimeline
# 插件版本（写入 META-INF/wiki-plugin.properties 的 plugin.version，也是构建产物版本号）
pluginVersion=0.1.0
# 描述文件里的兜底描述（英文技术描述；给人看的描述见 i18n/messages*.properties 的 plugin.easy-timeline.description）
pluginDescription=Server-side <timeline> renderer that emits inline SVG (ported from MediaWiki EasyTimeline)
