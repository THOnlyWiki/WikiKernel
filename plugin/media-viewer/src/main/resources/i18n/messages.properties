# 多媒体预览（插件 media-viewer）—— 默认语言（中文）
# 键名与迁移前 core 的 messages.properties 一致（core 里已删除，避免两处维护）；漏翻的键会直接显示键名
plugin.media-viewer.name=多媒体预览（TimedMediaHandler / MediaViewer）
plugin.media-viewer.description=移植自 MediaWiki TimedMediaHandler + MediaViewer：音视频播放器与图片放大查看

# 播放器（media-viewer.js，经 window.WIKI_MESSAGES 注入）
media.play=播放
media.pause=暂停
media.mute=静音
media.unmute=取消静音
media.fullscreen=全屏
media.download=原始文件
media.rate=播放速度
media.unsupported=您的浏览器不支持播放此格式，可下载原始文件观看。
media.loading=加载中

# 图片放大查看（image-viewer.js，经 window.WIKI_MESSAGES 注入）
imageViewer.close=关闭
imageViewer.prev=上一张
imageViewer.next=下一张
imageViewer.zoomIn=放大
imageViewer.zoomOut=缩小
imageViewer.fit=适应窗口
imageViewer.download=下载
imageViewer.original=原图
imageViewer.scaled=缩放到 {0}px 宽下载
imageViewer.working=正在生成…
imageViewer.failed=图片加载或生成失败，可尝试下载原图。
imageViewer.loading=加载中…
