# 插件名（技术名，不随语言变化；给人看的中文 / 英文名见 i18n/messages*.properties 的 plugin.gadgets.name）
pluginName=Gadgets
# 插件版本（写入 META-INF/wiki-plugin.properties 的 plugin.version，也是构建产物版本号）
pluginVersion=1.0.0
# 描述文件里的兜底描述（英文技术描述；给人看的描述见 i18n/messages*.properties 的 plugin.gadgets.description）
pluginDescription=User-selectable JavaScript / CSS gadgets defined on a wiki page and loaded per user (Special:Gadgets + a Preferences section)
